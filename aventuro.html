<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vortaventuro</title><style>*{box-sizing:border-box}body{margin:0;background:#050806;color:#edf3ee;font:16px system-ui}.app{max-width:900px;margin:auto;padding:12px}button,a{background:#172019;color:#fff;border:1px solid #536057;border-radius:8px;padding:10px;font-weight:800}.top,.stats,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.top h1{margin:0;flex:1}.stats{margin:10px 0}.stat{background:#101612;padding:7px 10px;border-radius:8px}.game{display:grid;grid-template-columns:1fr 280px;gap:10px}.panel{background:#101612;border:1px solid #303a33;border-radius:10px;padding:10px}.map{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:1px;background:#000}.cell{display:grid;place-items:center;background:#0d120f;font-weight:900}.dark{background:#000;color:#000}.mystery{background:#262217;color:#f1d27a}.you{background:#eaf5ed;color:#102017}.controls{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:5px;margin-top:10px}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1}.controls button:nth-child(4){grid-column:3}.controls button:nth-child(5){grid-column:2}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:12px}.modal.show{display:grid}.box{width:min(620px,100%);background:#111813;border:1px solid #6a786e;border-radius:12px;padding:14px}.hp{height:9px;background:#050705;border-radius:9px;overflow:hidden}.hp i{display:block;height:100%;background:#c4dfca}.enemy i{background:#d78f8f}.actions{margin:10px 0}.arena{height:220px;border:2px solid #ddd;background:#020302;position:relative;overflow:hidden}.soul,.haz{position:absolute;transform:translate(-50%,-50%)}.soul{width:18px;height:18px;background:white}.haz{background:#6b2028;padding:4px;border-radius:4px}.reward{background:#17231a;padding:10px;border-radius:8px;margin:10px 0}@media(max-width:700px){.game{grid-template-columns:1fr}.controls button{min-height:52px}}</style></head><body><div class="app"><div class="top"><h1>Vortaventuro</h1><a href="./">Home</a><button onclick="help()">How to play</button><button onclick="newRun()">New run</button></div><div class="stats"><div class="stat">Health <b id="hp"></b></div><div class="stat">Floor <b id="floor"></b></div><div class="stat">Attack <b id="atk"></b></div><div class="stat">Gold <b id="gold"></b></div><div class="stat">Keys <b id="keys"></b></div></div><div class="game"><div class="panel"><div><b>TORCH MAP</b> · ? = unknown</div><div id="map" class="map"></div><div class="controls"><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="waitTurn()">·</button><button onclick="move(1,0)">→</button><button onclick="move(0,1)">↓</button></div></div><div class="panel"><b>THE GUIDE</b><p id="guide">Only your torch reveals what is nearby. Step onto a ? to discover it.</p><hr><b>BACKPACK</b><p id="bag"></p><button onclick="potion()">Drink potion</button><hr><b>EVENT LOG</b><div id="log"></div></div></div></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script src="n1.js"></script><script src="v1.js"></script><script>const $=x=>document.getElementById(x),W=11,H=11,r=n=>Math.floor(Math.random()*n),pick=a=>a[r(a.length)];let S,battle=null;const enemies=[['Ombra rato','La rato montras siajn dentojn.'],['Osta gardisto','La gardisto levas sian glavon.'],['Nokta lupo','La lupo kuras al vi.'],['Perdita sorĉisto','La sorĉisto flustras malnovan vorton.'],['Ruĝa araneo','La araneo atendas en la mallumo.']];const vocab=(window.N||[]).map(x=>[x[0],x[1]]).filter(x=>x[0]&&x[1]);function grid(){let g=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>(x==0||y==0||x==W-1||y==H-1)?'#':'.'));let spots=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(x!=1||y!=1)spots.push([x,y]);spots.sort(()=>Math.random()-.5);for(let i=0;i<10;i++){let [x,y]=spots.pop();g[y][x]='M'}for(let i=0;i<5;i++){let[x,y]=spots.pop();g[y][x]=i<2?'T':i<4?'G':'K'}let[x,y]=spots.pop();g[y][x]='E';return g}function newRun(){S={hp:16,max:16,atk:2,gold:0,keys:0,potions:1,floor:1,x:1,y:1,g:grid(),log:[]};battle=null;$('modal').classList.remove('show');say('You enter the dungeon. Your torch reveals only nearby tiles.');render()}function render(){let m=$('map');m.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=document.createElement('div'),d=Math.max(Math.abs(x-S.x),Math.abs(y-S.y)),t=S.g[y][x];c.className='cell '+(d>2?'dark':x==S.x&&y==S.y?'you':t=='.'?'':t=='#'?'':'mystery');c.textContent=d>2?'':x==S.x&&y==S.y?'YOU':t=='.'?'·':t=='#'?'■':'?';m.appendChild(c)}$('hp').textContent=S.hp+'/'+S.max;$('floor').textContent=S.floor;$('atk').textContent=S.atk;$('gold').textContent=S.gold;$('keys').textContent=S.keys;$('bag').textContent='Potions: '+S.potions;$('log').innerHTML=S.log.slice(-8).reverse().map(x=>'<div>'+x+'</div>').join('')}function say(x){$('guide').textContent=x;S.log.push(x);render?.()}function move(dx,dy){if(battle)return;let x=S.x+dx,y=S.y+dy,t=S.g[y]?.[x];if(!t||t=='#')return say('A wall blocks the way.');S.x=x;S.y=y;if(t=='M')startBattle();else if(t=='G'){S.g[y][x]='.';let z=5+r(8);S.gold+=z;say('Vi trovas trezoron. You found '+z+' gold.')}else if(t=='K'){S.g[y][x]='.';S.keys++;say('Vi trovas ŝlosilon. You found a key.')}else if(t=='T'){S.g[y][x]='.';S.hp-=2;say('Kaptilo! You lose 2 health.');if(S.hp<=0)die()}else if(t=='E'){S.floor++;S.x=S.y=1;S.g=grid();S.hp=Math.min(S.max,S.hp+2);say('Vi iras pli profunden. Floor '+S.floor+'.')}else say('The corridor is quiet.');render()}function waitTurn(){say('You listen. Something may be nearby.')}function potion(){if(S.potions<1||S.hp>=S.max)return;S.potions--;S.hp=Math.min(S.max,S.hp+7);say('Vi trinkas pocion. +7 health.')}function startBattle(){let e=pick(enemies),boss=S.floor%5==0;battle={name:boss?'La Gardisto de Etaĝo '+S.floor:e[0],text:e[1],hp:(boss?25:12)+S.floor*3,max:(boss?25:12)+S.floor*3,atk:2+Math.floor(S.floor/2),mercy:0,turn:1};battleMenu()}function battleMenu(){let b=battle;$('box').innerHTML='<h2>'+b.name+'</h2><p>'+b.text+'</p><div>Via vivo: '+S.hp+'/'+S.max+'<div class="hp"><i style="width:'+(S.hp/S.max*100)+'%"></i></div></div><div>Malamiko: '+b.hp+'/'+b.max+'<div class="hp enemy"><i style="width:'+(b.hp/b.max*100)+'%"></i></div></div><p><b>Vico '+b.turn+'</b></p><div id="bt">Elektu agon.</div><div class="actions"><button onclick="fight()">ATAKU</button><button onclick="talk()">PAROLU</button><button onclick="guard()">DEFENDU</button><button onclick="flee()">'+(b.mercy>=3?'INDULGU':'FORKURU')+'</button></div>';$('modal').classList.add('show')}function fight(){let q=pick(vocab),opts=[q[1]];while(opts.length<4){let z=pick(vocab)[1];if(!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);$('box').innerHTML+='<div class="reward"><b>Esperanto:</b> How do you say “'+q[0]+'”?</div>'+opts.map(o=>'<button style="margin:4px" onclick="answer(this,\''+o.replaceAll("'","\\'")+'\',\''+q[1].replaceAll("'","\\'")+'\')">'+o+'</button>').join('')}function answer(btn,a,c){let good=a==c,d=good?S.atk+4:1;battle.hp-=d;if(battle.hp<=0)return victory();$('box').innerHTML='<h2>'+(good?'Ĝuste!':'Malĝuste.')+'</h2><p>Vi kaŭzas '+d+' damaĝon.</p>';setTimeout(()=>enemyTurn(false),650)}function talk(){battle.mercy++;$('box').innerHTML='<h2>PAROLU</h2><p>'+battle.text+'</p><p>'+(battle.mercy>=3?'La malamiko ne plu volas batali. Vi povas indulgi ĝin.':'La malamiko iom trankviliĝas.')+'</p>';setTimeout(()=>enemyTurn(false),750)}function guard(){enemyTurn(true)}function flee(){if(battle.mercy>=3)return spare();if(Math.random()<.35){battle=null;$('modal').classList.remove('show');say('Vi forkuras. No reward.')}else enemyTurn(false)}function enemyTurn(block){if(!battle)return;let b=battle;$('box').innerHTML='<h2>DEFENDU VIN</h2><p>Evitu la ruĝajn vortojn dum 3 sekundoj.</p><div class="arena" id="arena"><div class="soul" id="soul"></div></div>';let a=$('arena'),s=$('soul'),x=50,y=75,h=[],start=performance.now(),last=start,hit=0;s.style.left=x+'%';s.style.top=y+'%';for(let i=0;i<7+S.floor;i++){let e=document.createElement('div');e.className='haz';e.textContent=pick(['danĝero','fajro','ataku','ombro','mordo']);let hx=5+r(90),hy=-r(120);e.style.left=hx+'%';e.style.top=hy+'%';a.appendChild(e);h.push({e,x:hx,y:hy,v:25+r(20)})}function point(ev){let q=a.getBoundingClientRect();x=Math.max(3,Math.min(97,(ev.clientX-q.left)/q.width*100));y=Math.max(4,Math.min(96,(ev.clientY-q.top)/q.height*100));s.style.left=x+'%';s.style.top=y+'%'}a.onpointerdown=point;a.onpointermove=e=>{if(e.buttons)point(e)};function loop(t){let dt=(t-last)/1000;last=t;for(let z of h){z.y+=z.v*dt;z.e.style.top=z.y+'%';let A=s.getBoundingClientRect(),B=z.e.getBoundingClientRect();if(!z.dead&&A.left<B.right&&A.right>B.left&&A.top<B.bottom&&A.bottom>B.top&&t-hit>450){hit=t;z.dead=1;z.e.remove();let d=Math.max(1,b.atk-(block?1:0));S.hp-=d;if(S.hp<=0)return die()}}if(t-start<3000)requestAnimationFrame(loop);else{b.turn++;battleMenu();render()}}requestAnimationFrame(loop)}function reward(spared){let gold=6+S.floor*2+(spared?0:r(5)),item='';S.gold+=gold;let z=r(100);if(z<20){S.potions++;item='Pocio (Potion)'}else if(z<32){S.keys++;item='Ŝlosilo (Key)'}else if(z<40){S.max++;S.hp=Math.min(S.max,S.hp+2);item='Korfragmento (+1 max health)'}else if(z<46){S.atk++;item='Akriga ŝtono (+1 attack)'}return{gold,item}}function victory(){S.g[S.y][S.x]='.';let q=reward(false);battle=null;$('box').innerHTML='<h2>VENKO!</h2><div class="reward">Vi gajnas <b>'+q.gold+' ormon</b>.'+(q.item?'<br>La malamiko faligas: <b>'+q.item+'</b>.':'<br>Neniu objekto ĉi-foje.')+'</div><button onclick="finishBattle()">DAŬRIGU</button>'}function spare(){S.g[S.y][S.x]='.';let q=reward(true);battle=null;$('box').innerHTML='<h2>VI INDULGIS LA MALAMIKON</h2><div class="reward">Vi gajnas <b>'+q.gold+' ormon</b>.'+(q.item?'<br>Donaco: <b>'+q.item+'</b>.':'')+'</div><button onclick="finishBattle()">DAŬRIGU</button>'}function finishBattle(){$('modal').classList.remove('show');say('La batalo finiĝis. You can continue exploring.')}function die(){battle=null;$('box').innerHTML='<h2>Your run is over.</h2><p>You reached floor '+S.floor+'.</p><button onclick="newRun()">New run</button>';$('modal').classList.add('show')}function help(){$('box').innerHTML='<h2>How to play</h2><p>Move with the arrows. Your torch reveals only nearby tiles. Every unknown obstacle is shown only as <b>?</b>.</p><p>Combat actions and game events use Esperanto. Battles now last several turns: choose an action, answer vocabulary during attacks, then dodge the enemy attack in the box.</p><p><b>ATAKU</b> attack · <b>PAROLU</b> talk · <b>DEFENDU</b> guard · <b>FORKURU</b> flee · <b>INDULGU</b> spare.</p><p>Victories always award gold and can drop potions, keys, permanent health, or permanent attack upgrades.</p><button onclick="document.getElementById(\'modal\').classList.remove(\'show\')">Close</button>';$('modal').classList.add('show')}newRun();help();</script></body></html>

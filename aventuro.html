*{box-sizing:border-box}body{margin:0;background:#050806;color:#edf3ee;font:16px system-ui}.app{max-width:980px;margin:auto;padding:10px}button,a{background:#172019;color:#fff;border:1px solid #536057;border-radius:8px;padding:10px;font-weight:800;text-decoration:none}.top,.stats,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.top h1{margin:0;flex:1}.stats{margin:8px 0}.stat{background:#101612;padding:6px 9px;border-radius:8px}.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.panel{background:#101612;border:1px solid #303a33;border-radius:10px;padding:10px}.map{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:1px;background:#000;max-height:66svh;margin:auto}.cell{display:grid;place-items:center;background:#0d120f;font-weight:900;font-size:clamp(.45rem,1.7vw,.8rem)}.dark{background:#000;color:#000}.seen{background:#090d0a;color:#222}.mystery{background:#262217;color:#f1d27a}.you{background:#eaf5ed;color:#102017}.controls{display:grid;grid-template-columns:repeat(3,minmax(70px,86px));justify-content:center;gap:6px;margin-top:8px}.controls button{min-height:54px;font-size:1.15rem;touch-action:manipulation}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1}.controls button:nth-child(4){grid-column:3}.controls button:nth-child(5){grid-column:2}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:12px;z-index:50}.modal.show{display:grid}.box{width:min(660px,100%);max-height:92svh;overflow:auto;background:#111813;border:1px solid #6a786e;border-radius:12px;padding:14px}.hp{height:9px;background:#050705;border-radius:9px;overflow:hidden}.hp i{display:block;height:100%;background:#c4dfca}.enemy i{background:#d78f8f}.actions{margin:10px 0}.arena{height:230px;border:2px solid #ddd;background:#020302;position:relative;overflow:hidden;touch-action:none}.soul,.haz,.bonus{position:absolute;transform:translate(-50%,-50%)}.soul{width:20px;height:20px;background:white;color:#111;font-size:8px;font-weight:950;display:grid;place-items:center;border-radius:3px}.haz{background:#6b2028;padding:4px 6px;border-radius:4px;white-space:nowrap}.bonus{background:#164426;padding:4px 6px;border-radius:4px;white-space:nowrap}.reward,.story{background:#17231a;padding:10px;border-radius:8px;margin:10px 0}.story{border-left:3px solid #9db5a3}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.small{font-size:.78rem;color:#aebbb1}.scroll{max-height:180px;overflow:auto}.note{font-family:Georgia,serif;line-height:1.55;font-size:1.02rem}.sign{text-align:right;font-style:italic;margin-top:12px}.mobtag{display:inline-block;padding:3px 6px;border:1px solid #48564c;border-radius:999px;font-size:.72rem;margin-right:4px}

</style></head><body><div class="app"><div class="top"><h1>Vortaventuro</h1><a href="./">Home</a><button onclick="help()">How to play</button><button onclick="showLore()">Lore</button><button onclick="newRun()">New run</button></div><div class="stats"><div class="stat">XII · Health <b id="hp"></b></div><div class="stat">Floor <b id="floor"></b></div><div class="stat">Attack <b id="atk"></b></div><div class="stat">Defense <b id="def"></b></div><div class="stat">Gold <b id="gold"></b></div><div class="stat">Keys <b id="keys"></b></div></div><div class="game"><div class="panel"><div><b>TORCH MAP</b> · ? = unknown</div><div id="map" class="map"></div><div class="controls"><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="waitTurn()">·</button><button onclick="move(1,0)">→</button><button onclick="move(0,1)">↓</button></div></div><div class="panel"><b>THE GUIDE</b><p id="guide">The dungeon is listening.</p><hr><b>WHAT YOU HEAR</b><p id="hear"></p><hr><b>BACKPACK</b><p id="bag"></p><button onclick="potion()">Drink potion</button><div class="tabs"><button onclick="showNotebook()">Notebook</button><button onclick="showLore()">Lore</button></div><hr><b>EVENT LOG</b><div id="log" class="scroll"></div></div></div></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script src="n1.js"></script><script src="v1.js"></script><script>
const $=x=>document.getElementById(x),W=11,H=11,r=n=>Math.floor(Math.random()*n),pick=a=>a[r(a.length)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let S,battle=null,lastNote=-1;
const vocab=(window.N||[]).map(x=>[x[0],x[1]]).filter(x=>x[0]&&x[1]);
const verbs=(window.V||[]).map(x=>({en:x[0],inf:x[1],pre:x[2],past:x[3],fut:x[4],cond:x[5],imp:x[6]})).filter(x=>x.inf);
const notePool=[
["XII, if the walls whisper your name, do not answer. I did once. Something has been following my footsteps ever since.","XII, the walls have learned voices. If you hear yours, keep walking. I am no longer certain which footsteps behind me are mine.","— Mara, cartographer of the Third Descent"],
["XII, count the doors, not the rooms. The dungeon changes rooms when no one is looking, but doors remember where they belong.","XII, rooms lie. Doors do not. I marked nine yesterday and found the same nine today, though everything between them had moved.","— Oren, keeper of hinges"],
["XII, the creatures understand more Esperanto than they pretend. Speak before you strike. Some are prisoners here too.","XII, not every monster chose this place. Try PAROLU before your blade. One of them saved my life after I spared it.","— Sister Elio, Lantern House"],
["XII, never trust a perfectly clean corridor. Dust means time has passed there. Clean stone means something keeps returning.","XII, dust is a friend. A spotless hall is a warning. Something walks it often enough to polish the floor.","— Varek, last scout of Bell Company"],
["XII, the red words are not merely attacks. They are fragments of old commands. Learn them and you may learn who built this place.","XII, every red word was once spoken by someone. They are orders without a master now. I fear the master is waiting below.","— Teren, archivist in exile"],
["XII, the villages are real, but they do not belong to the same year. Ask people what season it is and listen carefully.","XII, I reached a village in spring and left it in winter without crossing a day. Do not assume the people you meet are from your time.","— Ina of the Green Lamp"],
["XII, keys are warm when they belong to a nearby door. If one turns cold, save it. That key opens something deeper.","XII, hold every key before using it. Warm keys are ordinary. Cold keys were made for doors the dungeon does not want you to find.","— Pell, locksmith without a shop"],
["XII, the fifth floor guardians are not beasts. They are questions wearing armor. Listen before you answer.","XII, every fifth descent ends with a guardian. Steel weakens them, but understanding finishes the work.","— Master Ruu, grammar knight"],
["XII, if you find a ring engraved with an eye, do not sell it. It remembers paths you have forgotten.","XII, I lost the eye-ring in the lower halls. If it finds you, keep it. It sees places torchlight cannot.","— Celest, pilgrim of the North Gate"],
["XII, the dungeon was once called the House of Tongues. No one agrees on who sealed it or why.","XII, this place had another name before the maps burned: the House of Tongues. The name was erased more carefully than the building.","— Edrin, royal historian"],
["XII, some enemies grow stronger when struck. Watch what they do after your first attack. Pride is a mechanic here.","XII, do not repeat yourself in battle. Certain creatures adapt. If the first blow angers it, change your tactic.","— Kessa, duelist of Seven Bridges"],
["XII, green words in battle are memories. Catch them when you can. They have kept me alive more than potions have.","XII, the green words are not bait. They are scraps of protection left by earlier travelers. Catch them if the red storm allows.","— Old Neme, twice escaped"],
["XII, the thing below floor ten knows the names of everyone who enters. I do not know how it learned yours before you arrived.","XII, I heard your name below the tenth floor before I ever met you. I am writing this because I hope you are not already expected.","— Aster, trembling witness"],
["XII, write down every word. The dungeon rewards memory and punishes confidence.","XII, your notebook is more important than your sword. A word forgotten here has a habit of returning with teeth.","— Fenn, schoolmaster of no school"],
["XII, if a merchant offers a silver potion for one gold, refuse it. Nothing here is that generous.","XII, cheap miracles are expensive later. I learned this from a silver vial and three missing days.","— Jozi, formerly lucky"],
["XII, listen for breathing. Heavy breath means flesh. No breath at all does not mean safety.","XII, creatures with lungs announce themselves. The ones without lungs are quieter, and usually worse.","— Ral, tunnel medic"],
["XII, there is a bell somewhere below. If you hear it ring thirteen times, do not move until the echo stops.","XII, twelve bells are a warning. Thirteen are an invitation. Do not accept.","— Nara, bellkeeper's daughter"],
["XII, mercy changes the dungeon. I cannot prove it, but doors opened for me after I spared the moon hound.","XII, the halls remember how you treat their inhabitants. I spared three creatures and found a locked door standing open.","— Sol, penitent hunter"],
["XII, the Archivist is not guarding the final room. The Archivist is guarding a sentence.","XII, I saw the Archivist once. It did not ask for blood. It asked me to finish a sentence I had never heard.","— Havel, failed linguist"],
["XII, if you reach the bottom, do not ask what the dungeon wants. Ask what it has forgotten.","XII, everyone asks why the dungeon was built. Wrong question. Ask what someone worked so hard to make it forget.","— Unknown hand, written in ash"]
];
const mobs=[
{name:"Ombra Rato",hp:9,atk:1,pat:"rain",weak:"talk",lore:"Rats that fed on ink in the old archive. They repeat words heard through stone.",lines:["Mi flaras vian timon.","La inko ankoraŭ gustas je reĝoj.","Ĉu vi ankaŭ aŭdas la murojn?"]},
{name:"Osta Gardisto",hp:15,atk:2,pat:"sides",weak:"spell",lore:"Soldiers bound to an oath whose final clause was erased.",lines:["Neniu pasas sen respondo.","Mi forgesis mian reĝon, sed ne mian ordonon.","Diru la ĝustan formon, XII."]},
{name:"Nokta Lupo",hp:12,atk:2,pat:"chase",weak:"talk",lore:"Moon-bred hounds once used to find students who fled the House of Tongues.",lines:["La nokto konas vian odoron.","Mi ĉasis aliajn antaŭ vi.","La luno ne videblas ĉi tie, sed mi ankoraŭ obeas."]},
{name:"Perdita Sorĉisto",hp:13,atk:2,pat:"spiral",weak:"spell",lore:"A scholar who conjugated one forbidden verb and has been repeating the mistake for decades.",lines:["Vortoj estas pli akraj ol glavoj.","Mi preskaŭ memoras la ĝustan finaĵon.","Ne korektu min... aŭ faru."]},
{name:"Ruĝa Araneo",hp:10,atk:3,pat:"web",weak:"fight",lore:"Its silk forms letters when touched by torchlight.",lines:["Mia reto jam konas vian nomon.","Ne tuŝu la literojn.","Ĉiu paŝo skribas ion."]},
{name:"Ŝtona Golemo",hp:22,atk:3,pat:"walls",weak:"spell",lore:"A moving punctuation mark carved from the foundation stones.",lines:["Mi staras. Mi gardas. Mi fermas.","Punkto finas frazon. Mi finas vojon.","Ne ĉiu muro estas senmova."]},
{name:"Blinda Korvo",hp:8,atk:2,pat:"sides",weak:"talk",lore:"It sees grammar as sound and attacks hesitation.",lines:["Mi vidas per sono.","Via paŭzo estas tro longa.","Parolu klare."]},
{name:"Fuma Spirito",hp:11,atk:2,pat:"drift",weak:"spell",lore:"Smoke from burned dictionaries that never stopped remembering their pages.",lines:["Ĉu vi efektive vidas min?","Mi estis mil paĝoj.","Fajro ne detruis ĉiujn vortojn."]},
{name:"Kupra Serpento",hp:14,atk:3,pat:"chase",weak:"fight",lore:"A mechanical tutor designed to punish repeated mistakes.",lines:["Unu eraro. Unu mordo.","Ripeto estas malsukceso.","Mi estis farita por instrui."]},
{name:"Silenta Kavaliro",hp:18,atk:3,pat:"walls",weak:"talk",lore:"A knight who took a vow to speak only when addressed correctly.",lines:["...","Demando postulas respondon.","Vi parolas. Mi aŭskultas."]},
{name:"Spegula Spirito",hp:12,atk:2,pat:"mirror",weak:"spell",lore:"It copies the last thing used against it.",lines:["Mi ripetas kion vi estas.","Via vorto revenos al vi.","Rigardu atente."]},
{name:"Ora Vespo",hp:7,atk:4,pat:"swarm",weak:"fight",lore:"A colony bred by merchants to guard coin vaults.",lines:["Riĉeco doloras.","Oro havas pikilon.","Prenu nenion sen prezo."]}
];
const storyBits=["Fragment: The House of Tongues was built to preserve every spoken language after the First Silence.","Fragment: The scholars created living exercises. Some became teachers. Others became predators.","Fragment: A king ordered one language erased from the archive. The order itself was erased next.","Fragment: Villages appeared inside the lower halls after the doors were sealed. No map explains how.","Fragment: The Archivist records not words, but the choices made while learning them.","Fragment: The number XII appears in margins centuries older than the current expedition.","Fragment: Someone called the Green Lamp resistance tried to free the living exercises.","Fragment: The deepest chamber is described only as 'the sentence that must not be completed.'"];
function grid(){let g=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>(x==0||y==0||x==W-1||y==H-1)?'#':'.'));let spots=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(x!=1||y!=1)spots.push([x,y]);spots.sort(()=>Math.random()-.5);for(let i=0;i<8+r(5);i++){let [x,y]=spots.pop();g[y][x]='M'}for(let i=0;i<6;i++){let[x,y]=spots.pop();g[y][x]=i<2?'T':i<4?'G':i==4?'K':'L'}let[x,y]=spots.pop();g[y][x]='E';return g}
function openingNote(){let idx=r(notePool.length);if(idx===lastNote)idx=(idx+1)%notePool.length;lastNote=idx;let n=notePool[idx],variant=r(2);$('box').innerHTML='<h2>A folded note in XII’s coat</h2><div class="note">'+n[variant]+'<div class="sign">'+n[2]+'</div></div><button onclick="closeModal()">Pocket the note</button>';$('modal').classList.add('show')}
function newRun(){S={hp:16,max:16,atk:2,def:0,gold:0,keys:0,potions:1,floor:1,x:1,y:1,g:grid(),seen:{},log:[],notebook:{},lore:[],mercy:0,kills:0};battle=null;closeModal();guide('You wake beneath a stone arch with a torch, a notebook, and a name stitched inside your coat: XII.');hear();render();openingNote()}
function render(){let m=$('map');m.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=document.createElement('div'),d=Math.max(Math.abs(x-S.x),Math.abs(y-S.y)),t=S.g[y][x],k=x+','+y;if(d<=2)S.seen[k]=1;c.className='cell '+(x==S.x&&y==S.y?'you':d>2&&!S.seen[k]?'dark':d>2?'seen':t=='.'?'':t=='#'?'':'mystery');c.textContent=x==S.x&&y==S.y?'XII':d>2&&!S.seen[k]?'':d>2?'·':t=='.'?'·':t=='#'?'■':'?';m.appendChild(c)}$('hp').textContent=S.hp+'/'+S.max;$('floor').textContent=S.floor;$('atk').textContent=S.atk;$('def').textContent=S.def;$('gold').textContent=S.gold;$('keys').textContent=S.keys;$('bag').textContent='Potions: '+S.potions+' · Lore fragments: '+S.lore.length;$('log').innerHTML=S.log.slice(-10).reverse().map(x=>'<div>'+x+'</div>').join('')}
function guide(x){$('guide').textContent=x;S.log.push(x)}
function hear(){let targets=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if('MEGKTL'.includes(S.g[y][x]))targets.push([x,y,S.g[y][x]]);if(!targets.length)return $('hear').textContent='Nur silento ĉirkaŭas vin.';targets.sort((a,b)=>Math.abs(a[0]-S.x)+Math.abs(a[1]-S.y)-Math.abs(b[0]-S.x)-Math.abs(b[1]-S.y));let [x,y,t]=targets[0],d=Math.abs(x-S.x)+Math.abs(y-S.y),dir=Math.abs(x-S.x)>Math.abs(y-S.y)?(x>S.x?'dekstre':'maldekstre'):(y>S.y?'malsupre':'supre');let q=t==='M'?'Vi aŭdas spiradon':t==='E'?'Vi sentas malvarman aeron':t==='G'?'Io briletas':t==='K'?'Io metala tintas':t==='T'?'Vi aŭdas etan klakon':'Vi aŭdas flustron';$('hear').textContent=d>6?'Io moviĝas malproksime en la mallumo.':q+' '+dir+'. '+(d<=2?'Ĝi estas tre proksime.':d<=4?'Ĝi estas proksime.':'Ĝi estas iom malproksime.')}
function move(dx,dy){if(battle)return;let x=S.x+dx,y=S.y+dy,t=S.g[y]?.[x];if(!t||t=='#'){guide('A wall blocks the way.');hear();return render()}S.x=x;S.y=y;if(t=='M')startBattle();else if(t=='G'){S.g[y][x]='.';let z=5+r(8);S.gold+=z;guide('You find a small cache. '+z+' gold added.')}else if(t=='K'){S.g[y][x]='.';S.keys++;guide('You find a cold iron key.')}else if(t=='L'){S.g[y][x]='.';discoverLore()}else if(t=='T'){S.g[y][x]='.';let d=Math.max(1,2-S.def);S.hp-=d;guide('A hidden mechanism snaps shut. You lose '+d+' health.');if(S.hp<=0)return die()}else if(t=='E'){S.floor++;S.x=S.y=1;S.g=grid();S.seen={};S.hp=Math.min(S.max,S.hp+2);guide('You descend. The air tastes older on floor '+S.floor+'.');if(S.floor%4===0)S.potions++;}else guide(pick(['The corridor narrows around XII.','Torchlight catches old writing, but it flakes away before you can read it.','A draft carries the smell of wet stone.','For a moment, XII hears footsteps matching every step.']));hear();render()}
function waitTurn(){guide('XII stands still and listens.');hear();render()}
function potion(){if(S.potions<1||S.hp>=S.max)return;S.potions--;S.hp=Math.min(S.max,S.hp+7);guide('You drink a potion and recover 7 health.');render()}
function discoverLore(){let unseen=storyBits.filter(x=>!S.lore.includes(x)),b=unseen.length?pick(unseen):pick(storyBits);S.lore.push(b);$('box').innerHTML='<h2>Archive Fragment</h2><div class="story">'+b+'</div><button onclick="closeModal()">Keep it</button>';$('modal').classList.add('show');guide('XII adds an archive fragment to the lore pages.')}
function showLore(){$('box').innerHTML='<h2>Lore collected by XII</h2>'+(S?.lore?.length?S.lore.map(x=>'<div class="story">'+x+'</div>').join(''):'<p>No fragments yet.</p>')+'<button onclick="closeModal()">Close</button>';$('modal').classList.add('show')}
function showNotebook(){$('box').innerHTML='<h2>XII’s Notebook</h2><div class="scroll">'+(Object.entries(S.notebook).length?Object.entries(S.notebook).map(([k,v])=>'<div><b>'+k+'</b> — '+v+'</div>').join(''):'No words recorded yet.')+'</div><button onclick="closeModal()">Close</button>';$('modal').classList.add('show')}
function learn(eo,en){S.notebook[eo]=en||S.notebook[eo]||'discovered in the dungeon'}
function startBattle(){let m=pick(mobs),boss=S.floor%5===0;battle={mob:m,name:boss?'Gardisto de la Kvina Sigelo':m.name,text:boss?'“XII. Mi atendis vin.”':pick(m.lines),hp:(boss?m.hp+14:m.hp)+S.floor*2,max:(boss?m.hp+14:m.hp)+S.floor*2,atk:m.atk+Math.floor(S.floor/3),mercy:0,turn:1,boss,lastAction:''};battleMenu()}
function battleMenu(){let b=battle,m=b.mob,spare=b.mercy>=3&&!b.boss;$('box').innerHTML='<h2>'+b.name+'</h2><p>'+b.text+'</p><div><span class="mobtag">'+m.pat+'</span><span class="mobtag">weakness: '+m.weak+'</span></div><div class="small">'+m.lore+'</div><br><div>XII: '+S.hp+'/'+S.max+'<div class="hp"><i style="width:'+(S.hp/S.max*100)+'%"></i></div></div><div>'+b.name+': '+Math.max(0,b.hp)+'/'+b.max+'<div class="hp enemy"><i style="width:'+(Math.max(0,b.hp)/b.max*100)+'%"></i></div></div><p><b>Turn '+b.turn+'</b></p><div id="bt">'+pick(m.lines)+'</div><div class="actions"><button onclick="fight()">ATAKU</button><button onclick="spell()">SORĈU</button><button onclick="talk()">PAROLU</button><button onclick="guard()">DEFENDU</button><button onclick="flee()">'+(spare?'INDULGU':'FORKURU')+'</button></div>';$('modal').classList.add('show')}
function fight(){battle.lastAction='fight';let q=pick(vocab),opts=[q[1]];while(opts.length<4){let z=pick(vocab)[1];if(!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);$('box').innerHTML+='<div class="reward"><b>Esperanto:</b> Kiel oni diras “'+q[0]+'”?<br><b>English:</b> How do you say “'+q[0]+'” in Esperanto?</div>'+opts.map(o=>'<button style="margin:4px" onclick="answerV(this,\''+o.replaceAll("'","\\'")+'\',\''+q[1].replaceAll("'","\\'")+'\',\''+q[0].replaceAll("'","\\'")+'\')">'+o+'</button>').join('')}
function answerV(btn,a,c,en){let good=a==c;learn(c,en);let mult=battle.mob.weak==='fight'?1.35:1,d=good?Math.max(2,Math.round((S.atk+3)*mult)):1;if(battle.mob.name==='Spegula Spirito'&&battle.lastAction==='fight')d=Math.max(1,Math.floor(d*.65));battle.hp-=d;if(battle.hp<=0)return victory();$('box').innerHTML='<h2>'+(good?'Ĝuste! / Correct!':'Malĝuste. / Incorrect.')+'</h2><p>XII deals '+d+' damage.</p>';setTimeout(()=>enemyTurn(false),650)}
function spell(){battle.lastAction='spell';let v=pick(verbs),forms=[['pre','present'],['past','past'],['fut','future'],['cond','conditional'],['imp','imperative']],f=pick(forms),c=v[f[0]],opts=[c];while(opts.length<4){let z=pick(verbs)[f[0]];if(z&&!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);$('box').innerHTML+='<div class="reward"><b>Esperanto:</b> Elektu la '+f[1]+'-formon de “'+v.inf+'”.<br><b>English:</b> Choose the '+f[1]+' form of “'+v.en+'”.</div>'+opts.map(o=>'<button style="margin:4px" onclick="answerSpell(\''+o.replaceAll("'","\\'")+'\',\''+c.replaceAll("'","\\'")+'\',\''+v.en.replaceAll("'","\\'")+'\')">'+o+'</button>').join('')}
function answerSpell(a,c,en){let good=a===c;learn(c,en);let mult=battle.mob.weak==='spell'?1.45:1,d=good?Math.max(3,Math.round((S.atk+4)*mult)):0;if(good)battle.hp-=d;if(battle.hp<=0)return victory();$('box').innerHTML='<h2>'+(good?'La sorĉo ekbrilas! / The spell flares!':'La sorĉo rompiĝas. / The spell breaks.')+'</h2><p>'+(good?'Damage: '+d:'No damage.')+'</p>';setTimeout(()=>enemyTurn(false),700)}
function talk(){battle.lastAction='talk';let bonus=battle.mob.weak==='talk'?2:1;battle.mercy+=bonus;battle.text=pick(battle.mob.lines);$('box').innerHTML='<h2>PAROLU</h2><p>'+battle.text+'</p><p>'+(battle.mercy>=3&&!battle.boss?'La malamiko mallevas sian defendon. / The enemy is ready to be spared.':'La malamiko aŭskultas. / The enemy listens.')+'</p>';setTimeout(()=>enemyTurn(false),850)}
function guard(){battle.lastAction='guard';enemyTurn(true)}
function flee(){if(battle.mercy>=3&&!battle.boss)return spare();if(battle.boss){$('box').innerHTML+='<p>La gardisto fermas la elirejon. / The guardian blocks the exit.</p>';return}if(Math.random()<.3){battle=null;closeModal();guide('XII escapes. The creature remains somewhere behind.');hear();render()}else enemyTurn(false)}
function enemyTurn(block){if(!battle)return;let b=battle,m=b.mob;$('box').innerHTML='<h2>DEFENDU VIN</h2><p>'+pick(m.lines)+'</p><div class="arena" id="arena"><div class="soul" id="soul">XII</div></div><p class="small">Evitu la ruĝajn vortojn. / Avoid the red words.</p>';let a=$('arena'),s=$('soul'),x=50,y=75,h=[],start=performance.now(),last=start,hit=0;s.style.left=x+'%';s.style.top=y+'%';let count=5+Math.min(10,S.floor)+m.atk;function add(text,hx,hy,vx,vy){let e=document.createElement('div');e.className='haz';e.textContent=text;e.style.left=hx+'%';e.style.top=hy+'%';a.appendChild(e);h.push({e,x:hx,y:hy,vx,vy})}for(let i=0;i<count;i++){let word=pick(['danĝero','fajro','ombro','mordo','kaptilo','silentu','haltu']);if(m.pat==='sides')add(word,i%2?-10:110,10+r(80),i%2?30:-30,0);else if(m.pat==='spiral'){let ang=i/count*Math.PI*2;add(word,50+43*Math.cos(ang),50+43*Math.sin(ang),-Math.sin(ang)*18,Math.cos(ang)*18)}else if(m.pat==='chase')add(word,5+r(90),-r(100),0,22+r(15));else if(m.pat==='web')add(word,10+r(80),i%2?-10:110,(50-r(100))/12,i%2?25:-25);else if(m.pat==='swarm')add(word,r(2)?-10:110,r(100),r(2)?38:-38,(50-r(100))/20);else if(m.pat==='walls')add(word,(i%2)*100,8+r(84),i%2?-22:22,0);else if(m.pat==='mirror')add(word,i%2?-10:110,20+r(60),i%2?28:-28,(i%3-1)*5);else add(word,5+r(90),-r(120),0,25+r(20))}function point(ev){let q=a.getBoundingClientRect();x=clamp((ev.clientX-q.left)/q.width*100,3,97);y=clamp((ev.clientY-q.top)/q.height*100,4,96);s.style.left=x+'%';s.style.top=y+'%'}a.onpointerdown=e=>{a.setPointerCapture?.(e.pointerId);point(e)};a.onpointermove=e=>{if(e.buttons||e.pressure)point(e)};let key=e=>{let d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[e.key.toLowerCase()];if(d){e.preventDefault();x=clamp(x+d[0]*6,3,97);y=clamp(y+d[1]*6,4,96);s.style.left=x+'%';s.style.top=y+'%'}};window.addEventListener('keydown',key);function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;for(let z of h){if(z.dead)continue;z.x+=z.vx*dt;z.y+=z.vy*dt;if(m.pat==='chase'){z.vx+=(x-z.x)*.04*dt*30;z.vy+=(y-z.y)*.02*dt*30}z.e.style.left=z.x+'%';z.e.style.top=z.y+'%';let A=s.getBoundingClientRect(),B=z.e.getBoundingClientRect();if(A.left<B.right&&A.right>B.left&&A.top<B.bottom&&A.bottom>B.top&&t-hit>550){hit=t;z.dead=1;z.e.remove();let d=Math.max(1,b.atk-S.def-(block?1:0));S.hp-=d;if(S.hp<=0){window.removeEventListener('keydown',key);return die()}}}if(t-start<3600)requestAnimationFrame(loop);else{window.removeEventListener('keydown',key);b.turn++;battleMenu();render()}}requestAnimationFrame(loop)}
function reward(spared){let gold=6+S.floor*2+(spared?0:r(6)),item='';S.gold+=gold;let z=r(100);if(z<22){S.potions++;item='Potion'}else if(z<35){S.keys++;item='Key'}else if(z<44){S.max++;S.hp=Math.min(S.max,S.hp+2);item='Heart Fragment (+1 max health)'}else if(z<51){S.atk++;item='Sharpening Stone (+1 attack)'}else if(z<57){S.def++;item='Rune Shield (+1 defense)'}else if(z<63){let unseen=storyBits.filter(x=>!S.lore.includes(x));if(unseen.length){let l=pick(unseen);S.lore.push(l);item='Archive Fragment'}}return{gold,item}}
function victory(){S.g[S.y][S.x]='.';S.kills++;let m=battle.mob,q=reward(false),boss=battle.boss;battle=null;if(boss&&S.lore.length<storyBits.length){let unseen=storyBits.filter(x=>!S.lore.includes(x));if(unseen.length)S.lore.push(pick(unseen))}$('box').innerHTML='<h2>VI VENKIS / VICTORY</h2><div class="reward">XII gains <b>'+q.gold+' gold</b>.'+(q.item?'<br>Drop: <b>'+q.item+'</b>.':'<br>No item dropped this time.')+'</div><div class="story"><b>Bestiary:</b> '+m.lore+'</div><button onclick="finishBattle()">Continue</button>'}

function takeKey(){current().grid[S.y][S.x]='.';S.keys++;lesson('Vi trovas ŝlosilon.',['trovas','ŝlosilon']);log('+1 ŝlosilo')}
function treasure(){current().grid[S.y][S.x]='.';let roll=r(5);if(roll===0){S.equip.weapon='fera glavo';S.atk++;lesson('Vi trovas feran glavon.',['trovas','feran','glavon'])}else if(roll===1){S.equip.shield='ligna ŝildo';S.def++;lesson('Vi trovas ŝildon.',['trovas','ŝildon'])}else if(roll===2){S.equip.ring='ringo de lumo';S.maxHp+=2;S.hp+=2;lesson('Vi trovas ringon de lumo.',['trovas','ringon','lumo'])}else{let z=5+r(8)+S.floor;S.gold+=z;lesson('Vi trovas '+z+' orajn monerojn.',['trovas','orajn','monerojn'])}}
function trap(){current().grid[S.y][S.x]='.';let d=Math.max(1,2+Math.floor(S.floor/3)-S.def);S.hp-=d;lesson('Kaptilo! Vi perdas '+d+' vivon.',['kaptilo','perdas','vivon']);if(S.hp<=0)die()}
function stairs(){pending=true;choice('Ŝtuparo kondukas profunden. Ĉu vi malsupreniras?',[['Malsupreniru.',()=>{S.floor++;S.x=1;S.y=1;getFloor(S.floor);pending=false;lesson('Vi malsupreniras al nova etaĝo.',['malsupreniras','nova','etaĝo']);render()}],['Restu ĉi tie.',()=>{pending=false;directionHint()}]])}
const npcLines=[['Maljuna instruisto','“Ne timu erari. Eraro estas pordo al kompreno.”'],['Rapida vendisto','“Mi vendas malmulton, sed ĉio estas utila.”'],['Vojaĝanto','“Mi aŭdis monstron malsupre. Ĝi ne ŝatas la vorton ‘kvankam’.”'],['Kuracisto','“Sidu. Spiru. Poste iru plu.”'],['Infano','“Ĉu vi trovis la oran ringon? Mi iam vidis ĝin.”'],['Gardisto','“La sekva pordo postulas pli ol ŝlosilon. Ĝi postulas komprenon.”']];
function npc(){let n=pick(npcLines);current().grid[S.y][S.x]='.';pending=true;choice(n[0]+': '+n[1],[['Dankon.',()=>{pending=false;lesson('La loĝanto ridetas kaj adiaŭas vin.',['loĝanto','ridetas','adiaŭas'])}],['Demandu pri danĝero.',()=>{pending=false;lesson('“Danĝero kreskas kun ĉiu etaĝo. Lernu la verbojn.”',['danĝero','kreskas','etaĝo','verbojn'])}]])}
function shop(){pending=true;choice('Vendisto: “Bonvenon. Kion vi volas aĉeti?”',[['Pocio — 8 oro',()=>buy('pocio',8)],['Fera ŝildo — 22 oro',()=>buy('shield',22)],['Ringo de sano — 28 oro',()=>buy('ring',28)],['Nenion.',()=>{pending=false;lesson('“Ĝis revido.”',['ĝis','revido'])}]])}
function buy(type,cost){if(S.gold<cost){lesson('“Vi ne havas sufiĉe da oro.”',['havas','sufiĉe','oro']);return}S.gold-=cost;if(type==='pocio')S.inventory.pocio=(S.inventory.pocio||0)+1;if(type==='shield'){S.equip.shield='fera ŝildo';S.def=Math.max(S.def,2)}if(type==='ring'){S.equip.ring='ringo de sano';S.maxHp+=3;S.hp+=3}pending=false;lesson('“Dankon pro la aĉeto.”',['dankon','aĉeto']);render()}
function usePotion(){if(!(S.inventory.pocio>0))return;S.inventory.pocio--;S.hp=Math.min(S.maxHp,S.hp+6);lesson('Vi trinkas pocion kaj resaniĝas.',['trinkas','pocion','resaniĝas']);render()}
function startBattle(boss){pending=true;let sp=boss?['ESTRO','La mallumo mem parolas.']:pick(species);battle={boss,name:boss?'Estro de Etaĝo '+S.floor:sp[0],dialogue:boss?'“Vi ne venkos per forto sola.”':sp[1],hp:(boss?15:6)+S.floor*2, max:(boss?15:6)+S.floor*2, atk:2+Math.floor(S.floor/2)};renderBattle()}
function renderBattle(){let b=battle;$('modalBox').innerHTML='<div class="battleTop"><div><h2>'+esc(b.name)+'</h2><div>'+esc(b.dialogue)+'</div></div><div>Vivo '+S.hp+'/'+S.maxHp+'<div class="hpbar"><i style="width:'+100*S.hp/S.maxHp+'%"></i></div><br>Monstro '+Math.max(0,b.hp)+'/'+b.max+'<div class="hpbar enemybar"><i style="width:'+100*Math.max(0,b.hp)/b.max+'%"></i></div></div></div><div id="battleText" class="battleText">Kion vi faros?</div><div class="battleActions"><button data-a="attack">ATAKU</button><button data-a="spell">SORĈU</button><button data-a="talk">PAROLU</button><button data-a="defend">DEFENDU</button><button data-a="run">FORKURU</button></div><div id="battleExtra"></div>';$('modal').classList.add('show');document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>battleAction(x.dataset.a))}
function battleAction(a){if(a==='attack')return vocabAttack();if(a==='spell')return grammarSpell();if(a==='talk'){ $('battleText').textContent=battle.dialogue; learn(battle.dialogue.split(' ')[0]); return }if(a==='defend')return enemyTurn(true);if(a==='run'){if(battle.boss){$('battleText').textContent='Vi ne povas forkuri de estro.';return}if(Math.random()<.55)return endBattle(false);return enemyTurn(false)}}
function vocabAttack(){let q=pick(deck),opts=[q.eo];while(opts.length<4){let z=pick(deck).eo;if(!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);showQuiz('How do you say “'+q.en+'” in Esperanto?',opts,q.eo,ok=>{let dmg=ok?S.atk+2:S.atk;hitEnemy(dmg);if(battle)enemyTurn(false)})}
function grammarSpell(){let v=pick(verbs),forms=[['present','-as'],['past','-is'],['future','-os'],['conditional','-us'],['imperative','-u']],f=pick(forms),correct=v[f[0]],opts=[correct];while(opts.length<4){let z=pick(verbs)[f[0]];if(z&&!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);showQuiz('Cast the spell: choose the '+f[0]+' form of “'+v.en+'” ('+v.inf+').',opts,correct,ok=>{if(ok){S.streak++;hitEnemy(S.atk+4+Math.min(3,S.streak))}else{S.streak=0;$('battleText').textContent='La sorĉo malsukcesas.'}if(battle)enemyTurn(false)})}
function showQuiz(prompt,opts,correct,cb){let ex=$('battleExtra');ex.innerHTML='<div class="battleText">'+esc(prompt)+'</div><div class="quizChoices">'+opts.map(o=>'<button data-q="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';ex.querySelectorAll('[data-q]').forEach(btn=>btn.onclick=()=>{let ok=btn.dataset.q===correct;btn.classList.add(ok?'good':'bad');learn(correct);setTimeout(()=>{ex.innerHTML='';cb(ok)},350)})}
function hitEnemy(d){battle.hp-=d;$('battleText').textContent='Vi trafas por '+d+' damaĝo.';if(battle.hp<=0)winBattle()}
function enemyTurn(block){if(!battle)return;startArena(block)}
function startArena(block){let ex=$('battleExtra');ex.innerHTML='<div class="arena" id="arena"><div class="soul" id="soul">VI</div></div><div class="arenaControls"><button class="u" data-m="0,-1">↑</button><button class="l" data-m="-1,0">←</button><button class="r" data-m="1,0">→</button><button class="d" data-m="0,1">↓</button></div><div class="kicker" style="margin-top:5px">Dodge dangerous Esperanto words. Collect the green word for a small defense bonus.</div>';let arena=$('arena'),soul=$('soul'),x=50,y=78,haz=[],good=pick(['ŝildo','sekura','defendu','rapide','maldekstre']);soul.style.left=x+'%';soul.style.top=y+'%';for(let i=0;i<6+Math.min(6,S.floor);i++){let h=document.createElement('div');h.className='hazard';h.textContent=pick(['danĝero','fajro','mordo','kaptilo','ombro','frapo']);h.style.left=(10+r(80))+'%';h.style.top=(-10-r(100))+'%';arena.appendChild(h);haz.push({el:h,y:parseFloat(h.style.top),x:parseFloat(h.style.left),spd:18+r(12)})}let bon=document.createElement('div');bon.className='bonus';bon.textContent=good;bon.style.left=(15+r(70))+'%';bon.style.top='-20%';arena.appendChild(bon);let by=-20,bx=parseFloat(bon.style.left),got=0,start=performance.now(),last=start;function moveSoul(dx,dy){x=Math.max(5,Math.min(95,x+dx*9));y=Math.max(8,Math.min(92,y+dy*9));soul.style.left=x+'%';soul.style.top=y+'%'}ex.querySelectorAll('[data-m]').forEach(b=>b.onpointerdown=()=>{let d=b.dataset.m.split(',').map(Number);moveSoul(...d)});let keyFn=e=>{let d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[e.key.toLowerCase()];if(d){e.preventDefault();moveSoul(...d)}};window.addEventListener('keydown',keyFn);function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;for(let h of haz){h.y+=h.spd*dt;h.el.style.top=h.y+'%';if(Math.abs(h.x-x)<8&&Math.abs(h.y-y)<7){S.hp-=Math.max(1,battle.atk-S.def-(block?1:0));h.y=120;if(S.hp<=0){window.removeEventListener('keydown',keyFn);return die()}}}by+=20*dt;bon.style.top=by+'%';if(!got&&Math.abs(bx-x)<9&&Math.abs(by-y)<8){got=1;bon.remove();S.hp=Math.min(S.maxHp,S.hp+1);learn(good)}if(t-start<2800)arenaLoop=requestAnimationFrame(loop);else{window.removeEventListener('keydown',keyFn);ex.innerHTML='';renderBattle()}}arenaLoop=requestAnimationFrame(loop)}
function winBattle(){let wasBoss=battle.boss;let gain=5+S.floor*2;S.gold+=gain;current().grid[S.y][S.x]='.';battle=null;if(wasBoss)return bossRiddle();endBattle(true)}
function bossRiddle(){let d=bossData[(Math.floor(S.floor/5)-1)%bossData.length];$('modalBox').innerHTML='<h2>'+esc(d[0])+'</h2><div class="battleText">'+esc(d[1])+'</div><div>'+esc(d[2])+'</div><div class="quizChoices">'+d[4].map(o=>'<button data-b="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';document.querySelectorAll('[data-b]').forEach(btn=>btn.onclick=()=>{if(btn.dataset.b===d[3]){learn(d[3]);$('modal').classList.remove('show');pending=false;S.maxHp+=2;S.hp=Math.min(S.maxHp,S.hp+4);lesson('La estro cedas. Vi komprenis la indicon.',['estro','komprenis','indicon']);render()}else{S.hp-=2;btn.classList.add('bad');if(S.hp<=0)die()}})}
function endBattle(win){battle=null;$('modal').classList.remove('show');pending=false;if(win)lesson('Vi venkis.',['venkis']);else lesson('Vi sukcesas eskapi.',['sukcesas','eskapi']);render()}
function die(){battle=null;pending=true;$('modalBox').innerHTML='<h2>La aventuro finiĝis.</h2><p>Vi atingis etaĝon '+S.floor+' kaj malkovris '+Object.keys(S.notebook).length+' vortojn.</p><button id="again">New run</button>';$('modal').classList.add('show');$('again').onclick=newRun}
function closeModal(){$('modal').classList.remove('show')}
function help(){$('modalBox').innerHTML='<h2>How to play</h2><p>Move one tile at a time. On iPad and mobile, use the large directional pad under the map. Your torch only reveals nearby tiles. Anything interactive stays as <b>?</b> until you reach it.</p><p>Dungeons are procedural. They contain locked doors, keys, traps, treasure, monsters, bosses, and exits. Every fourth floor is an Esperanto-only village.</p><p>Combat uses Esperanto commands. <b>SORĈU</b> casts stronger attacks by correctly conjugating verbs. Bosses test comprehension of Esperanto clues, not just isolated word memorization.</p><p>Your gear includes <b>glavo</b>, <b>ŝildo</b>, and <b>ringo</b>. Potions stay in your bag. The Notebook automatically records new Esperanto words during the run.</p><p>Fog memory is kept separately for every generated floor during your run.</p><button id="closeHelp">Close</button>';$('modal').classList.add('show');$('closeHelp').onclick=closeModal}
document.querySelectorAll('[data-d]').forEach(b=>b.onpointerdown=()=>{let d=b.dataset.d.split(',').map(Number);move(...d)});$('wait').onpointerdown=()=>{if(!pending){S.turn++;directionHint();render()}};$('help').onclick=help;$('newRun').onclick=()=>{if(confirm('Start a new run?'))newRun()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tabbody').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});window.addEventListener('keydown',e=>{if($('modal').classList.contains('show')||pending)return;let d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[e.key.toLowerCase()];if(d){e.preventDefault();move(...d)}});newRun();help();
</script></body></html>

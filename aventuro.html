<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vortaventuro</title><style>
*{box-sizing:border-box}
:root{--bg:#070a08;--panel:#101612;--panel2:#151d17;--line:#344139;--line2:#536057;--text:#edf3ee;--muted:#aebbb1;--gold:#e7cc78;--danger:#9c3944;--green:#bdd9c3;--shadow:0 14px 38px #0008}
html,body{min-height:100%;background:radial-gradient(circle at 50% -20%,#18231b 0,#090d0a 42%,#050706 100%);color:var(--text)}
body{margin:0;font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.app{width:min(1120px,100%);margin:auto;padding:14px}
button,a{appearance:none;background:linear-gradient(#1b251e,#131a16);color:#f7faf8;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font:800 13px/1 system-ui;text-decoration:none;letter-spacing:.02em;box-shadow:0 2px 0 #0006;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
button:hover,a:hover{border-color:#839087;background:#202b23}button:active,a:active{transform:translateY(1px);box-shadow:none}
.top{display:flex;gap:7px;align-items:center;padding:4px 0 10px;border-bottom:1px solid #253029}.top h1{margin:0 auto 0 0;font:900 clamp(22px,3vw,31px)/1 Georgia,serif;letter-spacing:.02em;color:#f4f0df;text-shadow:0 2px 12px #000}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:9px 0}.stat{min-width:0;background:linear-gradient(180deg,#141c17,#0e1410);border:1px solid #29342d;border-radius:9px;padding:7px 9px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.stat b{display:block;color:#fff;font-size:14px;letter-spacing:0;margin-top:1px;white-space:nowrap}
.game{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px;align-items:start}.panel{background:linear-gradient(180deg,#111814f2,#0c110ef2);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}.panel>b,.panel>div>b{font-size:11px;letter-spacing:.11em;color:#dbe6dd}
.map{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:1px;width:min(100%,calc(100svh - 210px));max-width:690px;margin:8px auto 0;background:#000;border:1px solid #313b34;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 40px #000,0 10px 28px #0007}.cell{display:grid;place-items:center;min-width:0;background:#0d120f;font-weight:900;font-size:clamp(.42rem,1.45vw,.78rem);user-select:none}.dark{background:#000;color:#000}.seen{background:#070a08;color:#1b251e}.mystery{background:radial-gradient(circle,#342d1d,#17140e);color:var(--gold);text-shadow:0 0 8px #d7b94a99}.you{background:radial-gradient(circle,#f4fff6 0,#bfd7c4 65%,#7e9985 100%);color:#102017;text-shadow:none;box-shadow:inset 0 0 12px #fff}
.controls{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,48px);justify-content:center;gap:5px;margin:8px auto 0}.controls button{min-height:46px;padding:0;font-size:18px;border-radius:10px;touch-action:manipulation}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1}.controls button:nth-child(3){grid-column:2;color:#819087}.controls button:nth-child(4){grid-column:3}.controls button:nth-child(5){grid-column:2}
#guide,#hear,#bag{margin:6px 0 10px}#hear{min-height:44px;color:#f0dfaa;font-family:Georgia,serif;font-style:italic}.panel hr{border:0;border-top:1px solid #2b352f;margin:10px -2px}.tabs,.actions{display:flex;gap:6px;flex-wrap:wrap}.tabs{margin-top:8px}.scroll{max-height:145px;overflow:auto;font-size:12px;color:#b9c5bc}.scroll>div{padding:5px 0;border-bottom:1px solid #202922}
.modal{position:fixed;inset:0;background:#020403e8;backdrop-filter:blur(4px);display:none;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));z-index:50}.modal.show{display:grid}.box{width:min(650px,100%);max-height:92svh;overflow:auto;background:linear-gradient(180deg,#141c17,#0b100d);border:1px solid #657269;border-radius:13px;padding:16px;box-shadow:0 24px 70px #000}.box h2{font:900 23px/1.15 Georgia,serif;color:#f5f0df;margin:0 0 10px}.box p{margin:8px 0}
.hp{height:9px;background:#030503;border:1px solid #273029;border-radius:9px;overflow:hidden;margin:3px 0 8px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#789c81,#c4dfca)}.enemy i{background:linear-gradient(90deg,#7b2630,#d78f8f)}.actions{margin:12px 0}.actions button{flex:1 1 95px;min-height:42px}.arena{height:min(250px,38svh);border:2px solid #d9dedb;background:radial-gradient(circle,#080b09,#010201);position:relative;overflow:hidden;touch-action:none;border-radius:2px;box-shadow:inset 0 0 35px #000}.soul,.haz,.bonus{position:absolute;transform:translate(-50%,-50%)}.soul{width:21px;height:21px;background:#fff;color:#111;font-size:7px;font-weight:950;display:grid;place-items:center;border-radius:3px;box-shadow:0 0 9px #fff8}.haz{background:#79232d;color:#fff;padding:4px 6px;border:1px solid #b24b55;border-radius:4px;white-space:nowrap;font-weight:800;font-size:12px;box-shadow:0 0 10px #8f263188}.bonus{background:#164426;padding:4px 6px;border-radius:4px;white-space:nowrap}.reward,.story{background:#162019;border:1px solid #334238;padding:10px;border-radius:8px;margin:10px 0}.reward{border-color:#5b5738;background:#1d1c12}.story{border-left:3px solid #9db5a3}.small{font-size:.78rem;color:var(--muted)}.note{font-family:Georgia,serif;line-height:1.65;font-size:1.04rem;background:#e5ddc5;color:#29251c;padding:18px;border-radius:3px;box-shadow:inset 0 0 30px #8d7a4933;transform:rotate(-.25deg);margin:12px 0}.sign{text-align:right;font-style:italic;margin-top:14px;color:#554b38}.mobtag{display:inline-block;padding:3px 7px;border:1px solid #48564c;background:#0c120e;border-radius:999px;font-size:.7rem;margin-right:4px;color:#c9d4cc}
@media(max-width:820px){.app{padding:8px}.game{grid-template-columns:minmax(0,1fr) 250px}.stats{grid-template-columns:repeat(3,1fr)}.map{width:min(100%,calc(100svh - 220px))}}
@media(max-width:650px){body{font-size:14px}.app{padding:6px}.top{gap:5px;overflow-x:auto;white-space:nowrap}.top h1{font-size:22px}.top button,.top a{padding:8px 9px;font-size:11px}.stats{grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}.stat{padding:5px 7px;font-size:9px}.stat b{font-size:12px}.game{grid-template-columns:1fr}.game>.panel:first-child{padding:7px}.game>.panel:nth-child(2){margin-top:0}.map{width:min(100%,calc(100svh - 255px));max-height:none;margin-top:5px}.controls{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,46px);position:sticky;bottom:max(4px,env(safe-area-inset-bottom));z-index:10;background:#070a08e8;border:1px solid #263129;padding:5px;border-radius:11px;backdrop-filter:blur(5px)}.controls button{min-height:44px}.box{padding:13px;max-height:94svh}.arena{height:min(230px,34svh)}.panel:nth-child(2){display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.panel:nth-child(2)>hr{grid-column:1/-1}.panel:nth-child(2)>.tabs,.panel:nth-child(2)>#log,.panel:nth-child(2)>b:last-of-type{grid-column:1/-1}}
@media(max-width:420px){.map{width:100%}.panel:nth-child(2){display:block}.controls{grid-template-columns:repeat(3,58px)}}
</style></head><body><div class="app"><div class="top"><h1>Vortaventuro</h1><a href="./">Home</a><button onclick="help()">How to play</button><button onclick="showLore()">Lore</button><button onclick="newRun()">New run</button></div><div class="stats"><div class="stat">XII · Health <b id="hp"></b></div><div class="stat">Floor <b id="floor"></b></div><div class="stat">Attack <b id="atk"></b></div><div class="stat">Defense <b id="def"></b></div><div class="stat">Gold <b id="gold"></b></div><div class="stat">Keys <b id="keys"></b></div></div><div class="game"><div class="panel"><div><b>TORCH MAP</b> · ? = unknown</div><div id="map" class="map"></div><div class="controls"><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="waitTurn()">·</button><button onclick="move(1,0)">→</button><button onclick="move(0,1)">↓</button></div></div><div class="panel"><b>THE GUIDE</b><p id="guide">The dungeon is listening.</p><hr><b>WHAT YOU HEAR</b><p id="hear"></p><hr><b>BACKPACK</b><p id="bag"></p><button onclick="potion()">Drink potion</button><div class="tabs"><button onclick="showNotebook()">Notebook</button><button onclick="showLore()">Lore</button></div><hr><b>EVENT LOG</b><div id="log" class="scroll"></div></div></div></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script src="n1.js"></script><script src="v1.js"></script><script>
const $=x=>document.getElementById(x),W=11,H=11,r=n=>Math.floor(Math.random()*n),pick=a=>a[r(a.length)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let S,battle=null,lastNote=-1;
const vocab=(window.N||[]).map(x=>[x[0],x[1]]).filter(x=>x[0]&&x[1]);
const verbs=(window.V||[]).map(x=>({en:x[0],inf:x[1],pre:x[2],past:x[3],fut:x[4],cond:x[5],imp:x[6]})).filter(x=>x.inf);
const notePool=[];
const mobs=[];
const storyBits=[];
function grid(){let g=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>(x==0||y==0||x==W-1||y==H-1)?'#':'.'));let spots=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(x!=1||y!=1)spots.push([x,y]);spots.sort(()=>Math.random()-.5);for(let i=0;i<8+r(5);i++){let [x,y]=spots.pop();g[y][x]='M'}for(let i=0;i<6;i++){let[x,y]=spots.pop();g[y][x]=i<2?'T':i<4?'G':i==4?'K':'L'}let[x,y]=spots.pop();g[y][x]='E';return g}
function openingNote(){let idx=r(notePool.length);if(idx===lastNote)idx=(idx+1)%notePool.length;lastNote=idx;let n=notePool[idx],variant=r(2);$('box').innerHTML='<h2>A folded note in XII’s coat</h2><div class="note">'+n[variant]+'<div class="sign">'+n[2]+'</div></div><button onclick="closeModal()">Pocket the note</button>';$('modal').classList.add('show')}
function newRun(){S={hp:16,max:16,atk:2,def:0,gold:0,keys:0,potions:1,floor:1,x:1,y:1,g:grid(),seen:{},log:[],notebook:{},lore:[],mercy:0,kills:0};battle=null;closeModal();guide('You wake beneath a stone arch with a torch, a notebook, and a name stitched inside your coat: XII.');hear();render();openingNote()}
function render(){let m=$('map');m.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=document.createElement('div'),d=Math.max(Math.abs(x-S.x),Math.abs(y-S.y)),t=S.g[y][x],k=x+','+y;if(d<=2)S.seen[k]=1;c.className='cell '+(x==S.x&&y==S.y?'you':d>2&&!S.seen[k]?'dark':d>2?'seen':t=='.'?'':t=='#'?'':'mystery');c.textContent=x==S.x&&y==S.y?'XII':d>2&&!S.seen[k]?'':d>2?'·':t=='.'?'·':t=='#'?'■':'?';m.appendChild(c)}$('hp').textContent=S.hp+'/'+S.max;$('floor').textContent=S.floor;$('atk').textContent=S.atk;$('def').textContent=S.def;$('gold').textContent=S.gold;$('keys').textContent=S.keys;$('bag').textContent='Potions: '+S.potions+' · Lore fragments: '+S.lore.length;$('log').innerHTML=S.log.slice(-10).reverse().map(x=>'<div>'+x+'</div>').join('')}
function guide(x){$('guide').textContent=x;S.log.push(x)}
function hear(){$('hear').textContent='Nur silento ĉirkaŭas vin.'}
function move(dx,dy){if(battle)return;let x=S.x+dx,y=S.y+dy,t=S.g[y]?.[x];if(!t||t=='#'){guide('A wall blocks the way.');hear();return render()}S.x=x;S.y=y;hear();render()}
function waitTurn(){guide('XII stands still and listens.');hear();render()}
function potion(){if(S.potions<1||S.hp>=S.max)return;S.potions--;S.hp=Math.min(S.max,S.hp+7);guide('You drink a potion and recover 7 health.');render()}
function showLore(){$('box').innerHTML='<h2>Lore collected by XII</h2><button onclick="closeModal()">Close</button>';$('modal').classList.add('show')}
function showNotebook(){$('box').innerHTML='<h2>XII’s Notebook</h2><button onclick="closeModal()">Close</button>';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function help(){$('box').innerHTML='<h2>A note in XII’s notebook</h2><p>Use WASD or the arrow keys to move exactly one tile per key press.</p><button onclick="closeModal()">Close</button>';$('modal').classList.add('show')}
let heldKeys=new Set();
window.addEventListener('keydown',e=>{
  if(!S||battle||$('modal').classList.contains('show'))return;
  const k=e.key.toLowerCase();
  const dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(!dirs[k]||e.repeat||heldKeys.has(k))return;
  e.preventDefault();heldKeys.add(k);move(...dirs[k]);
});
window.addEventListener('keyup',e=>heldKeys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>heldKeys.clear());
newRun();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Esperanto Quest Flashcards</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#1f2430}*{box-sizing:border-box}body{margin:0;background:#f5f6fa;min-height:100svh;padding:18px}.app{max-width:820px;margin:auto}.box{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 42px #0001}h1{margin:0 0 5px}.muted,.hint{color:#6b7280}.top{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}select,button,a{font:inherit;border:0;border-radius:14px;padding:14px;background:#eef0f5;font-weight:700;text-decoration:none;color:inherit;cursor:pointer}select{flex:1;min-width:240px}.back{background:#1f2430;color:white}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin:14px 0;flex-wrap:wrap}.bar{height:9px;background:#e8eaf0;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:#1f2430;transition:width .2s}.wrap{perspective:1200px;max-width:680px;margin:22px auto}.fc{height:min(52vh,420px);min-height:300px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1),translate .22s,opacity .22s;cursor:pointer;user-select:none;touch-action:pan-y}.fc.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #e6e8ee;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;padding:34px;box-shadow:0 14px 34px #0002;background:white}.front{font-size:clamp(1.8rem,5vw,3.2rem);font-weight:800}.backface{transform:rotateY(180deg);font-size:clamp(1.35rem,4vw,2.35rem);font-weight:750}.sub{display:block;font-size:.9rem;font-weight:500;color:#6b7280;margin-top:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.no{background:#ffe5e5}.yes{background:#e1f5e6}.hint{text-align:center;font-size:.86rem;margin:12px}.left{translate:-120% 0;rotate:-12deg;opacity:0}.right{translate:120% 0;rotate:12deg;opacity:0}@media(max-width:600px){.actions{grid-template-columns:1fr 1fr}.fc{height:46vh;min-height:280px}.box{padding:17px}}</style></head><body><div class="app"><div class="box"><h1>Esperanto Flashcards</h1><div class="muted">All of your Esperanto flashcard sets in one place.</div><div class="top"><select id="set"><option value="nouns">250 Nouns</option><option value="connectors">Conjunctions / Connectors</option><option value="prepositions">Prepositions</option><option value="grammar">250 Grammar Practice Sentences</option><option value="all">All Flashcards</option></select><button id="shuffle">Shuffle</button><a class="back" href="./">Back to Quiz</a></div><div class="stats"><span><span id="pos">1</span>/<span id="total">0</span></span><span>Know: <span id="yesN">0</span> · Don’t know: <span id="noN">0</span></span></div><div class="bar"><div id="bar"></div></div><div class="wrap"><div id="fc" class="fc"><div class="face front"><div><span id="front"></span><span class="sub">Tap to flip</span></div></div><div class="face backface"><div><span id="back"></span><span id="extra" class="sub"></span></div></div></div></div><div class="hint">Swipe left = Don’t know · Swipe right = Know · Tap = Flip<br>Keyboard: ← / → to sort, Space or Enter to flip</div><div class="actions"><button id="no" class="no">← Don’t know</button><button id="yes" class="yes">Know →</button></div></div></div><script src="n1.js"></script><script src="n2.js"></script><script src="c1.js"></script><script src="c2.js"></script><script src="c3.js"></script><script src="g1.js"></script><script src="g2.js"></script><script src="g3.js"></script><script>const $=x=>document.getElementById(x),shuf=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},N=(window.N||[]).map(x=>({en:x[0],eo:x[1],pl:x[2],obj:x[3]})),C=(window.C||[]).map(x=>({en:x[0],eo:x[1],cat:x[2]})),G=(window.G||[]).map(x=>({focus:x[0],en:x[1],eo:x[2]})),con=C.filter(x=>x.cat==='connector'),pre=C.filter(x=>x.cat==='preposition');const F={nouns:N.map((n,i)=>({id:'n:'+i,a:n.en,b:n.eo,x:'Plural: '+n.pl+' · Direct object: '+n.obj})),connectors:con.map((c,i)=>({id:'c:'+i,a:c.en,b:c.eo,x:'Conjunction / connector'})),prepositions:pre.map((c,i)=>({id:'p:'+i,a:c.en,b:c.eo,x:'Preposition / prepositional phrase'})),grammar:G.map((g,i)=>({id:'g:'+i,a:g.en,b:g.eo,x:'Grammar focus: '+g.focus}))};F.all=[...F.nouns,...F.connectors,...F.prepositions,...F.grammar];let deck=[],i=0,y=0,n=0,startX=0,drag=false;function load(s=false){deck=[...(F[$('set').value]||F.nouns)];if(s)deck=shuf(deck);i=y=n=0;render()}function render(){let c=deck[i];$('fc').className='fc';$('fc').style.transform='';$('front').textContent=c.a;$('back').textContent=c.b;$('extra').textContent=c.x||'';$('pos').textContent=i+1;$('total').textContent=deck.length;$('yesN').textContent=y;$('noN').textContent=n;$('bar').style.width=(i/deck.length*100)+'%'}function mark(ok){let e=$('fc');e.classList.remove('flip');e.classList.add(ok?'right':'left');ok?y++:n++;setTimeout(()=>{i++;if(i>=deck.length){deck=shuf(deck);i=0}render()},220)}$('fc').onclick=()=>{if(!drag)$('fc').classList.toggle('flip')};$('yes').onclick=()=>mark(true);$('no').onclick=()=>mark(false);$('set').onchange=()=>load(false);$('shuffle').onclick=()=>load(true);let e=$('fc');e.addEventListener('pointerdown',q=>{startX=q.clientX;drag=false;e.setPointerCapture(q.pointerId)});e.addEventListener('pointermove',q=>{if(!e.hasPointerCapture(q.pointerId))return;let dx=q.clientX-startX;if(Math.abs(dx)>8)drag=true;e.style.transform='translateX('+dx+'px) rotate('+(dx/25)+'deg)'});e.addEventListener('pointerup',q=>{let dx=q.clientX-startX;e.releasePointerCapture(q.pointerId);e.style.transform='';if(Math.abs(dx)>90)mark(dx>0);setTimeout(()=>drag=false,0)});document.addEventListener('keydown',q=>{if(q.key==='ArrowRight'){q.preventDefault();mark(true)}else if(q.key==='ArrowLeft'){q.preventDefault();mark(false)}else if(q.key===' '||q.key==='Enter'){q.preventDefault();$('fc').classList.toggle('flip')}});load(false);</script></body></html>

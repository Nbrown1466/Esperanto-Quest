<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Esperanto Quest</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#1f2430}
*{box-sizing:border-box} body{margin:0;background:#f5f6fa;min-height:100svh;padding:18px}
.app{max-width:820px;margin:auto}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 42px rgba(0,0,0,.08)}
h1{margin:0 0 4px;font-size:clamp(2rem,6vw,3.2rem)}.muted{color:#6b7280}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
select,button,input{font:inherit;border:0;border-radius:14px;padding:14px}select,input{background:#eef0f5}button{background:#eef0f5;font-weight:700;cursor:pointer;touch-action:manipulation}button.primary{background:#1f2430;color:white}
.stats{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin:14px 0}.mastery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.mastery div{background:#f2f3f7;border-radius:14px;padding:12px;text-align:center}.mastery strong{display:block;font-size:1.25rem}.mastery span{font-size:.8rem;color:#6b7280}.bar{height:9px;border-radius:999px;background:#e8eaf0;overflow:hidden}.bar>div{height:100%;width:0;background:#1f2430;transition:width .2s}
.badge{display:inline-block;font-size:.83rem;background:#eef0f5;border-radius:999px;padding:7px 10px;margin-top:20px}.q{font-size:clamp(1.35rem,4vw,2.15rem);font-weight:800;line-height:1.3;margin:16px 0 20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:62px;text-align:left}.correct{background:#dff5e4!important}.wrong{background:#ffe0e0!important}.feedback{min-height:28px;margin:16px 0;font-weight:700}
#next{display:none;width:100%;background:#1f2430;color:#fff}.typing{display:none;gap:10px}.typing input{flex:1}.typing button{background:#1f2430;color:#fff}.studyNote{font-size:.82rem;color:#7b8190;margin-top:6px}footer{font-size:.85rem;color:#7b8190;text-align:center;margin:14px}
.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}.particle{position:absolute;top:-12vh;font-size:32px;animation:fall 2.8s linear forwards}.confetti{width:12px;height:22px;border-radius:3px;font-size:0;background:hsl(var(--h),85%,55%);transform:rotate(var(--r))}.face{font-size:42px;animation-duration:3.4s}@keyframes fall{to{transform:translate(var(--drift),115vh) rotate(720deg);opacity:.9}}
@media(max-width:600px){.controls,.answers{grid-template-columns:1fr}.card{padding:20px}.typing{flex-direction:column}}
</style>
</head>
<body>
<div id="celebration" class="celebration"></div><div class="app"><div class="card">
<h1>Esperanto Quest</h1>
<div class="muted">Vocabulary + grammar from your study decks</div>
<div class="controls">
<select id="category"><option value="mixed">Mixed study</option><option value="nouns">Nouns</option><option value="connectors">Conjunctions / connectors</option><option value="prepositions">Prepositions</option><option value="grammar">Grammar sentences</option><option value="rules">Grammar rules & parts of speech</option></select>
<select id="mode"><option value="mixed">Mixed question types</option><option value="mc">Multiple choice only</option><option value="type">Typing only</option></select>
<select id="length"><option value="10">10 questions</option><option value="20">20 questions</option><option value="50">50 questions</option><option value="100">100 questions</option></select>
<button id="start" class="primary">Start round</button>
</div>
<div class="stats"><span>Score: <span id="score">0</span></span><span><span id="num">0</span>/<span id="total">10</span></span></div>
<div class="bar"><div id="bar"></div></div>
<div class="mastery"><div><strong id="knownCount">0</strong><span>Known</span></div><div><strong id="learningCount">0</strong><span>Learning</span></div><div><strong id="newCount">0</strong><span>New</span></div></div>
<div class="badge" id="kind">Ready</div><div class="q" id="q">Choose a category, then tap Start round.</div>
<div id="answers" class="answers"></div>
<div id="typing" class="typing"><input id="typed" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer"><button id="check">Check</button></div>
<div class="feedback" id="feedback"></div><button id="next">Next</button><div class="studyNote">Answers are saved on this device and weak material comes back more often.</div>
</div><footer>Esperanto Quest</footer></div>
<script src="n1.js"></script><script src="n2.js"></script><script src="c1.js"></script><script src="c2.js"></script><script src="c3.js"></script><script src="g1.js"></script><script src="g2.js"></script><script src="g3.js"></script>
<script>
const NOUNS=(window.N||[]).map(x=>({en:x[0],eo:x[1],plural:x[2],obj:x[3],plobj:x[4]}));
const CONNECTORS=(window.C||[]).map(x=>({en:x[0],eo:x[1],cat:x[2]}));
const GRAMMAR=(window.G||[]).map(x=>({focus:x[0],en:x[1],eo:x[2]}));
const $=id=>document.getElementById(id);const pick=a=>a[Math.floor(Math.random()*a.length)];
const normalize=s=>String(s).trim().toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
const RULES=[["What ending marks a noun in Esperanto?","-o",["-a","-e","-i"],"Noun ending"],["What ending marks an adjective?","-a",["-o","-e","-as"],"Adjective ending"],["What ending commonly marks an adverb?","-e",["-a","-o","-u"],"Adverb ending"],["What ending marks an infinitive verb?","-i",["-is","-as","-u"],"Infinitive"],["What ending marks present tense?","-as",["-is","-os","-us"],"Present tense"],["What ending marks past tense?","-is",["-as","-os","-u"],"Past tense"],["What ending marks future tense?","-os",["-as","-is","-us"],"Future tense"],["What ending marks the conditional?","-us",["-u","-os","-is"],"Conditional"],["What ending marks the imperative / volitive?","-u",["-us","-i","-as"],"Imperative"],["What ending marks plural nouns and adjectives?","-j",["-n","-s","-i"],"Plural"],["What ending marks the accusative (direct object)?","-n",["-j","-m","-r"],"Accusative"],["Which part of speech is 'rapide' (quickly)?","adverb",["noun","adjective","verb"],"Parts of speech"],["Which part of speech is 'bela' (beautiful)?","adjective",["noun","adverb","preposition"],"Parts of speech"],["Which part of speech is 'domo' (house)?","noun",["verb","adjective","conjunction"],"Parts of speech"],["Which part of speech is 'kuri' (to run)?","verb",["noun","adverb","preposition"],"Parts of speech"],["Which word means 'the' in Esperanto?","la",["unu","de","je"],"Article"],["Does Esperanto have an indefinite article like 'a/an'?","No",["Yes","Only before nouns","Only in plural"],"Articles"],["Which pronoun means 'I'?","mi",["vi","ni","li"],"Pronouns"],["Which pronoun means 'we'?","ni",["mi","ili","oni"],"Pronouns"],["Which pronoun means 'they'?","ili",["ni","ĝi","si"],"Pronouns"],["Which word asks 'why'?","kial",["kiel","kiam","kie"],"Correlatives"],["Which word asks 'how'?","kiel",["kial","kiam","kio"],"Correlatives"],["Which word asks 'when'?","kiam",["kiel","kie","kial"],"Correlatives"],["Which word asks 'where'?","kie",["kio","kiu","kiam"],"Correlatives"],["Which form means 'would go'?","irus",["iris","iros","iras"],"Conditional"],["Which form means 'went'?","iris",["iras","iros","iru"],"Past tense"],["Which form means 'will go'?","iros",["iris","irus","iras"],"Future tense"],["Which form means 'go!'?","iru",["iri","iras","irus"],"Imperative"],["In 'Mi vidas la katon', why does kato become katon?","It is the direct object",["It is plural","It is an adjective","It is past tense"],"Accusative"],["In 'La belaj floroj', why does bela become belaj?","It agrees with the plural noun",["It is a verb","It is accusative singular","It is an adverb"],"Adjective agreement"]];
const nounEO=NOUNS.map(x=>x.eo),nounEN=NOUNS.map(x=>x.en),nounPL=NOUNS.map(x=>x.plural),nounOBJ=NOUNS.map(x=>x.obj),nounPLOBJ=NOUNS.map(x=>x.plobj);
const conn=CONNECTORS.filter(x=>x.cat==="connector"),prep=CONNECTORS.filter(x=>x.cat==="preposition"),connEO=conn.map(x=>x.eo),connEN=conn.map(x=>x.en),prepEO=prep.map(x=>x.eo),prepEN=prep.map(x=>x.en),gramEO=GRAMMAR.map(x=>x.eo),gramEN=GRAMMAR.map(x=>x.en),focuses=[...new Set(GRAMMAR.map(x=>x.focus))];
function sampleOthers(list,correct,n=3){const out=[],seen=new Set([correct]);if(list.length<=n)return list.filter(x=>x!==correct);while(out.length<n){const v=pick(list);if(!seen.has(v)){seen.add(v);out.push(v)}}return out}
function shuffleSmall(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mc(q,correct,wrongs,kind,id){return{q,correct,options:shuffleSmall([correct,...wrongs]),kind,type:"mc",id}}
const BANKS={nouns:[],connectors:[],prepositions:[],grammar:[],rules:[]};
NOUNS.forEach((n,i)=>{BANKS.nouns.push(mc(`What is “${n.en}” in Esperanto?`,n.eo,sampleOthers(nounEO,n.eo),"English → Esperanto",`n:${i}:en-eo`));BANKS.nouns.push(mc(`What does “${n.eo}” mean?`,n.en,sampleOthers(nounEN,n.en),"Esperanto → English",`n:${i}:eo-en`));BANKS.nouns.push(mc(`What is the plural of “${n.eo}”?`,n.plural,sampleOthers(nounPL,n.plural),"Noun plural • -j",`n:${i}:plural`));BANKS.nouns.push(mc(`What is the singular direct-object form of “${n.eo}”?`,n.obj,sampleOthers(nounOBJ,n.obj),"Accusative • -n",`n:${i}:obj`));BANKS.nouns.push(mc(`What is the plural direct-object form of “${n.eo}”?`,n.plobj,sampleOthers(nounPLOBJ,n.plobj),"Plural accusative • -jn",`n:${i}:plobj`));BANKS.nouns.push(mc(`What part of speech is “${n.eo}”?`,"noun",["verb","adjective","adverb"],"Parts of speech",`n:${i}:pos`))});
conn.forEach((c,i)=>{BANKS.connectors.push(mc(`What is “${c.en}” in Esperanto?`,c.eo,sampleOthers(connEO,c.eo),"Connector",`c:${i}:en-eo`));BANKS.connectors.push(mc(`What does “${c.eo}” mean?`,c.en,sampleOthers(connEN,c.en),"Connector",`c:${i}:eo-en`));BANKS.connectors.push(mc(`What kind of expression is “${c.eo}”?`,"conjunction / connector",["noun","adjective","preposition / prepositional phrase"],"Parts of speech",`c:${i}:pos`))});
prep.forEach((c,i)=>{BANKS.prepositions.push(mc(`What is “${c.en}” in Esperanto?`,c.eo,sampleOthers(prepEO,c.eo),"Preposition",`p:${i}:en-eo`));BANKS.prepositions.push(mc(`What does “${c.eo}” mean?`,c.en,sampleOthers(prepEN,c.en),"Preposition",`p:${i}:eo-en`));BANKS.prepositions.push(mc(`What kind of expression is “${c.eo}”?`,"preposition / prepositional phrase",["noun","verb","conjunction / connector"],"Parts of speech",`p:${i}:pos`))});
GRAMMAR.forEach((g,i)=>{BANKS.grammar.push(mc(`Translate: “${g.en}”`,g.eo,sampleOthers(gramEO,g.eo),"Sentence translation",`g:${i}:en-eo`));BANKS.grammar.push(mc(`What does this mean? “${g.eo}”`,g.en,sampleOthers(gramEN,g.en),"Sentence comprehension",`g:${i}:eo-en`));BANKS.grammar.push(mc(`Which grammar focus best matches: “${g.eo}”?`,g.focus,sampleOthers(focuses,g.focus),"Identify the grammar",`g:${i}:focus`))});
RULES.forEach((r,i)=>BANKS.rules.push(mc(r[0],r[1],r[2],r[3],`r:${i}`)));
BANKS.mixed=[...BANKS.nouns,...BANKS.connectors,...BANKS.prepositions,...BANKS.grammar,...BANKS.rules];
const STORAGE_KEY="esperantoQuestMasteryV2";let mastery={};try{mastery=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){mastery={}}
function statusFor(q){const m=mastery[q.id];if(!m)return"new";const acc=m.correct/m.attempts;return(m.correct>=3&&m.streak>=2&&acc>=.8)?"known":"learning"}
function record(q,ok){const m=mastery[q.id]||{attempts:0,correct:0,wrong:0,streak:0,lastSeen:0};m.attempts++;m.lastSeen=Date.now();if(ok){m.correct++;m.streak++}else{m.wrong++;m.streak=0}mastery[q.id]=m;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(mastery))}catch(e){}updateMasteryUI()}
function updateMasteryUI(){let k=0,l=0,n=0;for(const q of BANKS.mixed){const s=statusFor(q);if(s==="known")k++;else if(s==="learning")l++;else n++}$('knownCount').textContent=k;$('learningCount').textContent=l;$('newCount').textContent=n}
function chooseQuestion(bank,excludeId=null){let pool=excludeId?bank.filter(q=>q.id!==excludeId):bank;if(!pool.length)pool=bank;let bucket=[];const r=Math.random();if(r<.55)bucket=pool.filter(q=>statusFor(q)==="learning");if(!bucket.length&&r<.88)bucket=pool.filter(q=>statusFor(q)==="new");if(!bucket.length)bucket=pool.filter(q=>statusFor(q)==="known");if(!bucket.length)bucket=pool;return pick(bucket)}
let score=0,idx=0,total=10,current=null,locked=false,lastQuestionId=null,roundFinished=false;
function currentBank(){return BANKS[$('category').value]||BANKS.mixed}
function start(){score=0;idx=0;lastQuestionId=null;roundFinished=false;total=+$('length').value;$('score').textContent='0';$('total').textContent=total;$('next').textContent='Next';nextQ()}
function nextQ(){locked=false;$('check').disabled=false;$('feedback').textContent='';$('next').style.display='none';$('answers').innerHTML='';$('typing').style.display='none';if(idx>=total){finish();return}current=chooseQuestion(currentBank(),lastQuestionId);lastQuestionId=current.id;const mode=$('mode').value;const isType=mode==='type'||(mode==='mixed'&&Math.random()<.28);$('num').textContent=idx+1;$('bar').style.width=(idx/total*100)+'%';$('kind').textContent=current.kind+' • '+statusFor(current);$('q').textContent=current.q;if(isType){$('typing').style.display='flex';$('typed').value='';setTimeout(()=>$('typed').focus(),50)}else{for(const o of shuffleSmall(current.options)){const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>answerMC(b,o);$('answers').appendChild(b)}}}
function answerMC(btn,val){if(locked)return;locked=true;for(const b of $('answers').children){b.disabled=true;if(b.textContent===current.correct)b.classList.add('correct')}const ok=val===current.correct;if(ok){score++;$('score').textContent=score;$('feedback').textContent='Ĝuste! Correct.'}else{btn.classList.add('wrong');$('feedback').textContent='Correct answer: '+current.correct}record(current,ok);advanceSoon()}
function checkTyped(){if(locked)return;const val=$('typed').value;if(!val.trim())return;locked=true;$('check').disabled=true;const ok=normalize(val)===normalize(current.correct);if(ok){score++;$('score').textContent=score;$('feedback').textContent='Ĝuste! Correct.'}else{$('feedback').textContent='Correct answer: '+current.correct}record(current,ok);advanceSoon()}
function advanceSoon(){idx++;$('bar').style.width=(idx/total*100)+'%';$('next').style.display='block';$('next').textContent=idx>=total?'Finish':'Next'}
function tone(freq,dur,type='sine',delay=0){try{const A=window.AudioContext||window.webkitAudioContext;window._eqAudio=window._eqAudio||new A();const c=window._eqAudio,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.13,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.03)}catch(e){}}
function resultSound(level){if(level==='great'){tone(523,.18,'triangle');tone(659,.18,'triangle',.16);tone(784,.28,'triangle',.32)}else if(level==='meh'){tone(330,.18,'sine');tone(294,.22,'sine',.18)}else{tone(220,.25,'sine');tone(175,.35,'sine',.22)}}
function shower(kind){const box=$('celebration');box.innerHTML='';const count=kind==='confetti'?90:45;for(let i=0;i<count;i++){const e=document.createElement('div');e.className='particle '+(kind==='confetti'?'confetti':'face');if(kind!=='confetti')e.textContent=kind==='sad'?'😢':'😐';e.style.left=(Math.random()*100)+'vw';e.style.animationDelay=(Math.random()*1.1)+'s';e.style.setProperty('--drift',((Math.random()-.5)*180)+'px');e.style.setProperty('--r',(Math.random()*180)+'deg');e.style.setProperty('--h',Math.floor(Math.random()*360));box.appendChild(e)}setTimeout(()=>box.innerHTML='',4800)}
function finish(){roundFinished=true;$('num').textContent=total;$('bar').style.width='100%';$('kind').textContent='Round complete';const pct=total?score/total:0;$('q').textContent=`You scored ${score} / ${total} (${Math.round(pct*100)}%).`;$('answers').innerHTML='';$('typing').style.display='none';if(pct>=.7){$('feedback').textContent=pct>=.9?'Bonege!':'Tre bone!';shower('confetti');resultSound('great')}else if(pct<=.5){$('feedback').textContent='Keep practicing. Weak cards will come back more often.';shower('sad');resultSound('sad')}else{$('feedback').textContent='Not bad — keep going!';shower('meh');resultSound('meh')}$('next').textContent='Play again';$('next').style.display='block'}
$('start').onclick=start;$('next').onclick=()=>{if(roundFinished)start();else nextQ()};$('check').onclick=checkTyped;$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(locked&&$('next').style.display==='block')$('next').click();else checkTyped()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement!==$('typed')&&$('next').style.display==='block'){e.preventDefault();$('next').click()}});document.addEventListener('keydown',e=>{if(locked||!current||$('typing').style.display!=='none')return;if(!['1','2','3','4'].includes(e.key))return;const buttons=[...$('answers').querySelectorAll('.answer')];const i=Number(e.key)-1;if(buttons[i]){e.preventDefault();buttons[i].click()}});$('category').onchange=()=>{$('kind').textContent='Ready';$('q').textContent='Tap Start round.'};updateMasteryUI();
</script></body></html>

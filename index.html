<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Esperanto Quest</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f6f7fb;color:#1f2430;min-height:100svh;display:grid;place-items:center;padding:24px}
.game{width:min(100%,680px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.09)}
h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 8px}.sub{color:#6d7280;font-size:1.05rem}.top{display:flex;justify-content:space-between;gap:16px;margin:24px 0 12px;font-weight:700}.progress{height:10px;background:#eceef5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#1f2430;width:10%;transition:width .2s}.q{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:750;line-height:1.25;margin:28px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{font:inherit;border:0;border-radius:16px;padding:18px;min-height:64px;background:#eef0f6;color:#1f2430;cursor:pointer;font-size:1.1rem;font-weight:650;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.99)}.correct{background:#dff6e5!important}.wrong{background:#ffe0e0!important}.feedback{min-height:34px;margin-top:18px;font-weight:700;font-size:1.05rem}#next{display:none;width:100%;margin-top:8px;background:#1f2430;color:#fff}@media(max-width:520px){.answers{grid-template-columns:1fr}.game{padding:22px}}
</style></head><body><main class="game"><h1>Esperanto Quest</h1><div class="sub">Tap the correct Esperanto word.</div><div class="top"><span>Score: <span id="score">0</span></span><span><span id="num">1</span>/10</span></div><div class="progress"><div id="bar"></div></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next">Next</button></main><script>
const cards=[["to go","iri"],["to want","voli"],["to know a fact","scii"],["to fix","ripari"],["to fight","batali"],["to wear / carry","porti"],["mother","patrino"],["father","patro"],["store","vendejo"],["always","ĉiam"],["when","kiam"],["how","kiel"],["why","kial"],["more","pli"],["most","plej"],["the same","la sama"],["boyfriend","koramiko"],["wedding day","geedziĝtago"],["happy","feliĉa"],["sad","malĝoja"],["yes","jes"],["first / firstly","unue"],["correct / right","ĝuste"],["humanity / mankind","homaro"],["to be","esti"],["to say","diri"],["to love","ami"],["thing","afero"],["at home","hejme"]];let score=0,n=0,locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function load(){locked=false;$("feedback").textContent="";$("next").style.display="none";$("num").textContent=n+1;$("bar").style.width=((n+1)*10)+"%";const item=cards[Math.floor(Math.random()*cards.length)];const correct=item[1];const wrongs=shuffle(cards.filter(x=>x[1]!==correct)).slice(0,3).map(x=>x[1]);const opts=shuffle([correct,...wrongs]);$("q").textContent=`What is "${item[0]}" in Esperanto?`;$("answers").innerHTML="";opts.forEach(opt=>{const b=document.createElement("button");b.textContent=opt;b.onclick=()=>{if(locked)return;locked=true;[...$("answers").children].forEach(x=>{if(x.textContent===correct)x.classList.add("correct")});if(opt===correct){score++;$("score").textContent=score;$("feedback").textContent="Ĝuste! Correct."}else{b.classList.add("wrong");$("feedback").textContent=`Not quite — ${correct}.`}$("next").style.display="block";};$("answers").appendChild(b);});}$("next").onclick=()=>{n++;if(n>=10){$("bar").style.width="100%";$("q").textContent=`Finished — ${score}/10`;$("answers").innerHTML="";$("feedback").textContent=score>=9?"Bonege!":score>=7?"Tre bone!":"Try another round.";$("next").textContent="Play again";$("next").style.display="block";$("next").onclick=()=>location.reload();}else load();};load();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Esperanto Quest</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#1f2430}
*{box-sizing:border-box} body{margin:0;background:#f5f6fa;min-height:100svh;padding:18px}
.app{max-width:820px;margin:auto}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 42px rgba(0,0,0,.08)}
h1{margin:0 0 4px;font-size:clamp(2rem,6vw,3.2rem)} .muted{color:#6b7280}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
select,button,input{font:inherit;border:0;border-radius:14px;padding:14px} select,input{background:#eef0f5}
button{background:#eef0f5;font-weight:700;cursor:pointer} button.primary{background:#1f2430;color:white}
.stats{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin:14px 0}.bar{height:9px;border-radius:999px;background:#e8eaf0;overflow:hidden}.bar>div{height:100%;width:0;background:#1f2430}
.badge{display:inline-block;font-size:.83rem;background:#eef0f5;border-radius:999px;padding:7px 10px;margin-top:20px}
.q{font-size:clamp(1.35rem,4vw,2.15rem);font-weight:800;line-height:1.3;margin:16px 0 20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{min-height:62px;text-align:left}.correct{background:#dff5e4!important}.wrong{background:#ffe0e0!important}.feedback{min-height:28px;margin:16px 0;font-weight:700}
#next{display:none;width:100%;background:#1f2430;color:#fff}.typing{display:none;gap:10px}.typing input{flex:1}.typing button{background:#1f2430;color:#fff}
footer{font-size:.85rem;color:#7b8190;text-align:center;margin:14px}.start{display:flex;gap:10px}.start button{flex:1}
@media(max-width:600px){.controls,.answers{grid-template-columns:1fr}.card{padding:20px}.typing{flex-direction:column}}
</style>
</head>
<body>
<div class="app"><div class="card">
<h1>Esperanto Quest</h1>
<div class="muted">Vocabulary + grammar from your study decks</div>
<div class="controls">
<select id="category">
<option value="mixed">Mixed study</option>
<option value="nouns">Nouns</option>
<option value="connectors">Conjunctions / connectors</option>
<option value="prepositions">Prepositions</option>
<option value="grammar">Grammar sentences</option>
<option value="rules">Grammar rules & parts of speech</option>
</select>
<select id="mode">
<option value="mixed">Mixed question types</option>
<option value="mc">Multiple choice only</option>
<option value="type">Typing only</option>
</select>
<select id="length">
<option value="10">10 questions</option>
<option value="20">20 questions</option>
<option value="50">50 questions</option>
<option value="100">100 questions</option>
</select>
<button id="start" class="primary">Start round</button>
</div>
<div class="stats"><span>Score: <span id="score">0</span></span><span><span id="num">0</span>/<span id="total">10</span></span></div>
<div class="bar"><div id="bar"></div></div>
<div class="badge" id="kind">Choose a round</div>
<div class="q" id="q">Pick a category and start.</div>
<div id="answers" class="answers"></div>
<div id="typing" class="typing"><input id="typed" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer"><button id="check">Check</button></div>
<div class="feedback" id="feedback"></div>
<button id="next">Next</button>
</div><footer>Esperanto Quest • 1,000 cards from your PowerPoint decks</footer></div>

<script src="n1.js"></script><script src="n2.js"></script><script src="c1.js"></script><script src="c2.js"></script><script src="c3.js"></script><script src="g1.js"></script><script src="g2.js"></script><script src="g3.js"></script>
<script>
const NOUNS=N.map(x=>({en:x[0],eo:x[1],plural:x[2],obj:x[3],plobj:x[4]}));
const CONNECTORS=C.map(x=>({en:x[0],eo:x[1],cat:x[2]}));
const GRAMMAR=G.map(x=>({focus:x[0],en:x[1],eo:x[2]}));
const $=x=>document.getElementById(x);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const normalize=s=>s.trim().toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ');
const RULES=[
["What ending marks a noun in Esperanto?","-o",["-a","-e","-i"],"Noun ending"],
["What ending marks an adjective?","-a",["-o","-e","-as"],"Adjective ending"],
["What ending commonly marks an adverb?","-e",["-a","-o","-u"],"Adverb ending"],
["What ending marks an infinitive verb?","-i",["-is","-as","-u"],"Infinitive"],
["What ending marks present tense?","-as",["-is","-os","-us"],"Present tense"],
["What ending marks past tense?","-is",["-as","-os","-u"],"Past tense"],
["What ending marks future tense?","-os",["-as","-is","-us"],"Future tense"],
["What ending marks the conditional?","-us",["-u","-os","-is"],"Conditional"],
["What ending marks the imperative / volitive?","-u",["-us","-i","-as"],"Imperative"],
["What ending marks plural nouns and adjectives?","-j",["-n","-s","-i"],"Plural"],
["What ending marks the accusative (direct object)?","-n",["-j","-m","-r"],"Accusative"],
["Which part of speech is 'rapide' (quickly)?","adverb",["noun","adjective","verb"],"Parts of speech"],
["Which part of speech is 'bela' (beautiful)?","adjective",["noun","adverb","preposition"],"Parts of speech"],
["Which part of speech is 'domo' (house)?","noun",["verb","adjective","conjunction"],"Parts of speech"],
["Which part of speech is 'kuri' (to run)?","verb",["noun","adverb","preposition"],"Parts of speech"],
["Which word means 'the' in Esperanto?","la",["unu","de","je"],"Article"],
["Does Esperanto have an indefinite article like 'a/an'?","No",["Yes","Only before nouns","Only in plural"],"Articles"],
["Which pronoun means 'I'?","mi",["vi","ni","li"],"Pronouns"],
["Which pronoun means 'we'?","ni",["mi","ili","oni"],"Pronouns"],
["Which pronoun means 'they'?","ili",["ni","ĝi","si"],"Pronouns"],
["Which word asks 'why'?","kial",["kiel","kiam","kie"],"Correlatives"],
["Which word asks 'how'?","kiel",["kial","kiam","kio"],"Correlatives"],
["Which word asks 'when'?","kiam",["kiel","kie","kial"],"Correlatives"],
["Which word asks 'where'?","kie",["kio","kiu","kiam"],"Correlatives"],
["Which form means 'would go'?","irus",["iris","iros","iras"],"Conditional"],
["Which form means 'went'?","iris",["iras","iros","iru"],"Past tense"],
["Which form means 'will go'?","iros",["iris","irus","iras"],"Future tense"],
["Which form means 'go!'?","iru",["iri","iras","irus"],"Imperative"],
["In 'Mi vidas la katon', why does kato become katon?","It is the direct object",["It is plural","It is an adjective","It is past tense"],"Accusative"],
["In 'La belaj floroj', why does bela become belaj?","It agrees with the plural noun",["It is a verb","It is accusative singular","It is an adverb"],"Adjective agreement"]
];
let score=0,idx=0,total=10,current=null,locked=false;
function distract(list,correct,n=3){return shuffle([...new Set(list.filter(x=>x!==correct))]).slice(0,n)}
function mc(q,correct,wrongs,kind){return {q,correct,options:shuffle([correct,...wrongs]),kind,type:"mc"}}
function nounQuestion(n){const t=pick(["en-eo","eo-en","plural","obj","plobj","pos"]);if(t==="en-eo")return mc(`What is “${n.en}” in Esperanto?`,n.eo,distr(NOUNS.map(x=>x.eo),n.eo),"English → Esperanto");if(t==="eo-en")return mc(`What does “${n.eo}” mean?`,n.en,distr(NOUNS.map(x=>x.en),n.en),"Esperanto → English");if(t==="plural")return mc(`What is the plural of “${n.eo}”?`,n.plural,distr(NOUNS.map(x=>x.plural),n.plural),"Noun plural • -j");if(t==="obj")return mc(`What is the singular direct-object form of “${n.eo}”?`,n.obj,distr(NOUNS.map(x=>x.obj),n.obj),"Accusative • -n");if(t==="plobj")return mc(`What is the plural direct-object form of “${n.eo}”?`,n.plobj,distr(NOUNS.map(x=>x.plobj),n.plobj),"Plural accusative • -jn");return mc(`What part of speech is “${n.eo}”?`,"noun",["verb","adjective","adverb"],"Parts of speech")}
function connectorQuestion(c){const t=pick(["en-eo","eo-en","pos"]),same=CONNECTORS.filter(x=>x.cat===c.cat);if(t==="en-eo")return mc(`What is “${c.en}” in Esperanto?`,c.eo,distr(same.map(x=>x.eo),c.eo),c.cat==="connector"?"Connector":"Preposition");if(t==="eo-en")return mc(`What does “${c.eo}” mean?`,c.en,distr(same.map(x=>x.en),c.en),c.cat==="connector"?"Connector":"Preposition");return mc(`What kind of expression is “${c.eo}”?`,c.cat==="connector"?"conjunction / connector":"preposition / prepositional phrase",c.cat==="connector"?["noun","adjective","preposition / prepositional phrase"]:["noun","verb","conjunction / connector"],"Parts of speech")}
function grammarQuestion(g){const t=pick(["en-eo","eo-en","focus"]);if(t==="en-eo")return mc(`Translate: “${g.en}”`,g.eo,distr(GRAMMAR.map(x=>x.eo),g.eo),"Sentence translation");if(t==="eo-en")return mc(`What does this mean? “${g.eo}”`,g.en,distr(GRAMMAR.map(x=>x.en),g.en),"Sentence comprehension");const f=[...new Set(GRAMMAR.map(x=>x.focus))];return mc(`Which grammar focus best matches: “${g.eo}”?`,g.focus,distr(f,g.focus),"Identify the grammar")}
function ruleQuestion(){const r=pick(RULES);return mc(r[0],r[1],r[2],r[3])}
function makeQuestion(){const cat=$("category").value,mode=$("mode").value;let q;if(cat==="nouns")q=nounQuestion(pick(NOUNS));else if(cat==="connectors")q=connectorQuestion(pick(CONNECTORS.filter(x=>x.cat==="connector")));else if(cat==="prepositions")q=connectorQuestion(pick(CONNECTORS.filter(x=>x.cat==="preposition")));else if(cat==="grammar")q=grammarQuestion(pick(GRAMMAR));else if(cat==="rules")q=ruleQuestion();else{const group=pick(["noun","connector","prep","grammar","rule"]);if(group==="noun")q=nounQuestion(pick(NOUNS));else if(group==="connector")q=connectorQuestion(pick(CONNECTORS.filter(x=>x.cat==="connector")));else if(group==="prep")q=connectorQuestion(pick(CONNECTORS.filter(x=>x.cat==="preposition")));else if(group==="grammar")q=grammarQuestion(pick(GRAMMAR));else q=ruleQuestion()}if(mode==="type"||(mode==="mixed"&&Math.random()<.28))q={q:q.q,correct:q.correct,kind:q.kind,type:"type"};return q}
function start(){score=0;idx=0;total=+$("length").value;$("score").textContent=0;$("total").textContent=total;nextQ()}
function nextQ(){locked=false;$("feedback").textContent="";$("next").style.display="none";$("answers").innerHTML="";$("typing").style.display="none";if(idx>=total){finish();return}current=makeQuestion();$("num").textContent=idx+1;$("bar").style.width=(idx/total*100)+"%";$("kind").textContent=current.kind;$("q").textContent=current.q;if(current.type==="type"){$("typing").style.display="flex";$("typed").value="";setTimeout(()=>$("typed").focus(),100)}else current.options.forEach(o=>{const b=document.createElement("button");b.className="answer";b.textContent=o;b.onclick=()=>answerMC(b,o);$("answers").appendChild(b)})}
function answerMC(btn,val){if(locked)return;locked=true;[...$("answers").children].forEach(b=>{if(b.textContent===current.correct)b.classList.add("correct")});if(val===current.correct){score++;$("score").textContent=score;$("feedback").textContent="Ĝuste! Correct."}else{btn.classList.add("wrong");$("feedback").textContent=`Correct answer: ${current.correct}`}revealNext()}
function checkTyped(){if(locked)return;locked=true;const val=$("typed").value;if(normalize(val)===normalize(current.correct)){score++;$("score").textContent=score;$("feedback").textContent="Ĝuste! Correct."}else $("feedback").textContent=`Correct answer: ${current.correct}`;revealNext()}
function revealNext(){idx++;$("bar").style.width=(idx/total*100)+"%";$("next").style.display="block"}
function finish(){$("num").textContent=total;$("bar").style.width="100%";$("kind").textContent="Round complete";$("q").textContent=`You scored ${score} / ${total}.`;$("answers").innerHTML="";$("typing").style.display="none";$("feedback").textContent=score/total>=.9?"Bonege!":score/total>=.7?"Tre bone!":"Keep practicing — another round will mix in new cards.";$("next").textContent="Play again";$("next").style.display="block";$("next").onclick=start}
$("start").onclick=start;$("next").onclick=()=>{$("next").textContent="Next";nextQ()};$("check").onclick=checkTyped;$("typed").addEventListener("keydown",e=>{if(e.key==="Enter")checkTyped()});
</script></body></html>

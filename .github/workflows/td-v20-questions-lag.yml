name: TD v20 questions and lag fix
on:
  push:
    paths:
      - '.github/workflows/td-v20-questions-lag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch multiplayer questions and lag
        run: python .github/scripts/td_v20_questions_lag.py
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('tdlearn.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          js='\n'.join(x for x in scripts if x.strip())
          f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False)
          f.write(js); f.close()
          subprocess.run(['node','--check',f.name],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tdlearn.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Give both co-op players questions and reduce join lag"
          git push

name: Fix TD white screen
on:
  push:
    paths:
      - '.github/workflows/fix-td-white-screen.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair invalid ternaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tdlearn.html')
          s=p.read_text()
          s=s.replace("(now<e.slow?.7:1)", "(now<e.slow ? .7 : 1)")
          s=s.replace("t.damage*=now<damagePenalty?.75:1", "t.damage*=now<damagePenalty ? .75 : 1")
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tdlearn.html').read_text()
          js=re.search(r'<script>(.*)</script></body>',s,re.S).group(1)
          Path('/tmp/td.js').write_text(js)
          PY
          node --check /tmp/td.js
      - name: Commit fix
        run: |
          git config user.name 'Esperanto Quest Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tdlearn.html
          git diff --cached --quiet || git commit -m 'Fix tower defense white screen syntax error'
          git push

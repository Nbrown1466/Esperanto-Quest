name: Vortaventuro regression checks
on:
  push:
    branches: [main]
    paths:
      - 'aventuro*'
      - 'test-game.cjs'
      - 'n1.js'
      - 'v1.js'
      - '.github/workflows/aventuro-v6b.yml'
  pull_request:
    paths:
      - 'aventuro*'
      - 'test-game.cjs'
      - 'n1.js'
      - 'v1.js'
      - '.github/workflows/aventuro-v6b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game scripts
        run: |
          node --check aventuro.js
          node --check aventuro-story.js
      - name: Verify dungeon and combat behavior
        run: node test-game.cjs

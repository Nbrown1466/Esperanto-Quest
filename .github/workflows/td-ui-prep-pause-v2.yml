name: TD UI prep pause v2
on:
  push:
    paths:
      - '.github/workflows/td-ui-prep-pause-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and patch TD
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('tdlearn.html')
          s=p.read_text()
          s=s.replace("color:'#d7a62e'};const U=", "color:'#d7a62e'}};const U=")
          s=s.replace("body{margin:0;background:#eef5ff;padding:10px}","body{margin:0;background:linear-gradient(#7cc85b,#58a944);padding:10px}")
          s=s.replace(".app{max-width:1220px;margin:auto}",".app{max-width:1260px;margin:auto;background:#2f6f3e;border:4px solid #1f4b2b;border-radius:20px;padding:10px;box-shadow:inset 0 0 0 2px #8fd36e}")
          s=s.replace(".home,button,select{border:0;border-radius:12px;padding:10px 12px;background:#fff;font:inherit;font-weight:800;box-shadow:0 4px 14px #0001}",".home,button,select{border:2px solid #5f3b17;border-radius:12px;padding:10px 12px;background:linear-gradient(#ffe36a,#f7b733);color:#3d260d;font:inherit;font-weight:900;box-shadow:0 3px 0 #5f3b17,0 5px 10px #0003}")
          s=s.replace(".title{font-size:clamp(1.4rem,4vw,2.3rem);font-weight:950}",".title{font-size:clamp(1.4rem,4vw,2.3rem);font-weight:950;color:#fff;text-shadow:0 3px 0 #24502e}")
          s=s.replace(".stat{flex:1;min-width:85px;background:#fff;border-radius:13px;padding:7px;text-align:center;color:#667085;font-size:.76rem}",".stat{flex:1;min-width:85px;background:linear-gradient(#fff7c8,#f3d982);border:2px solid #6f4b21;border-radius:13px;padding:7px;text-align:center;color:#6d5636;font-size:.76rem;box-shadow:inset 0 -3px #0001}")
          s=s.replace(".panel,.arena{background:#fff;border-radius:18px;padding:9px}",".panel,.arena{background:#f5e8b7;border:3px solid #775126;border-radius:18px;padding:9px;box-shadow:inset 0 0 0 2px #fff8d8}")
          s=s.replace(".side{display:flex;flex-direction:column;gap:9px}",".side{display:flex;flex-direction:column;gap:9px;max-height:650px;overflow-y:auto;overflow-x:hidden;padding-right:6px;scrollbar-width:thin;scrollbar-color:#c28a31 #f4deb0}.side::-webkit-scrollbar{width:10px}.side::-webkit-scrollbar-track{background:#f4deb0;border-radius:10px}.side::-webkit-scrollbar-thumb{background:#c28a31;border-radius:10px;border:2px solid #f4deb0}")
          s=s.replace(".tower{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;border:2px solid #e5e9f0;box-shadow:none;text-align:left}",".tower{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;border:2px solid #80551f;box-shadow:0 2px 0 #80551f;text-align:left;background:linear-gradient(#fff8cf,#f0d47d)}")
          s=s.replace(".tower.sel{border-color:#466fd8}",".tower.sel{border-color:#2f7fe5;box-shadow:0 0 0 3px #89c7ff}")
          s=s.replace(".pause{position:absolute;top:10px;left:10px;background:#172033dd;color:#fff;border-radius:999px;padding:7px 10px;font-weight:900;display:none}",".pause{position:absolute;top:10px;left:10px;background:#173c24e8;color:#fff;border:2px solid #f6d65b;border-radius:999px;padding:7px 10px;font-weight:900;display:none}")
          s=s.replace("@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.q,.upanel{grid-column:1/-1}}", "@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;max-height:none;overflow:visible;padding-right:0}.q,.upanel{grid-column:1/-1}}")
          s=s.replace('<button id="sound">Sound: On</button><button id="new">New game</button>', '<button id="sound">Sound: On</button><button id="play">▶ Play</button><button id="pauseBtn" disabled>Ⅱ Pause</button><button id="new">New game</button>')
          s=s.replace('<div id="paused" class="pause">Paused for question</div>', '<div id="paused" class="pause">Paused</div><div id="prep" style="position:absolute;inset:0;display:grid;place-items:center;background:#173c2488;pointer-events:none"><div style="background:#fff3b5;border:4px solid #6f471f;border-radius:18px;padding:16px 22px;text-align:center;box-shadow:0 5px 0 #4f3216"><b style="font-size:1.25rem">SET UP YOUR DEFENDERS</b><br><span class="small">Place characters first, then press Play to begin Wave 1.</span></div></div>')
          s=s.replace("damagePenalty=0,last=performance.now();", "damagePenalty=0,manualPause=0,started=0,last=performance.now();")
          s=s.replace("function start(){if(over||qopen)return;wave++;nextQ=false;spawning=true;queue=plan(wave);spawnT=0;paused=false;$('paused').classList.remove('show');sfx('wave');toast(map.short+' · Wave '+wave);hud()}","function start(){if(over||qopen)return;started=1;manualPause=0;$('prep').style.display='none';$('play').disabled=true;$('pauseBtn').disabled=false;$('pauseBtn').textContent='Ⅱ Pause';wave++;nextQ=false;spawning=true;queue=plan(wave);spawnT=0;paused=false;$('paused').classList.remove('show');sfx('wave');toast(map.short+' · Wave '+wave);hud()}")
          s=s.replace("qopen=1;paused=1;$('paused').classList.add('show');", "qopen=1;paused=1;$('paused').textContent='Question pause';$('paused').classList.add('show');")
          old="function reset(){map=MAPS[$('map').value];lanes=map.lanes;lens=lanes.map(plen);lives=map.lives;coins=map.coins;wave=0;score=0;towers=[];enemies=[];shots=[];selType=null;selTower=-1;paused=0;over=0;spawning=0;queue=[];spawnT=0;qopen=0;qlock=0;nextQ=0;preview=null;boost=0;fastPenalty=0;damagePenalty=0;$('upanel').classList.remove('show');$('question').classList.remove('show');$('over').classList.remove('show');$('upbtn').disabled=true;$('mapInfo').textContent=map.info;document.querySelectorAll('.tower').forEach(b=>b.classList.remove('sel'));showScores();hud();setTimeout(start,250)}"
          new="function reset(){map=MAPS[$('map').value];lanes=map.lanes;lens=lanes.map(plen);lives=map.lives;coins=map.coins;wave=0;score=0;towers=[];enemies=[];shots=[];selType=null;selTower=-1;paused=1;manualPause=0;started=0;over=0;spawning=0;queue=[];spawnT=0;qopen=0;qlock=0;nextQ=0;preview=null;boost=0;fastPenalty=0;damagePenalty=0;$('upanel').classList.remove('show');$('question').classList.remove('show');$('over').classList.remove('show');$('paused').classList.remove('show');$('prep').style.display='grid';$('play').disabled=false;$('pauseBtn').disabled=true;$('pauseBtn').textContent='Ⅱ Pause';$('upbtn').disabled=true;$('mapInfo').textContent=map.info+' Set up defenders before pressing Play.';document.querySelectorAll('.tower').forEach(b=>b.classList.remove('sel'));showScores();hud()}"
          if old not in s: raise SystemExit('reset pattern not found')
          s=s.replace(old,new)
          marker="$('sound').onclick=()=>{"
          inject="$('play').onclick=()=>{if(!started&&!over)start()};$('pauseBtn').onclick=()=>{if(!started||over||qopen)return;manualPause=!manualPause;paused=manualPause;$('pauseBtn').textContent=manualPause?'▶ Resume':'Ⅱ Pause';$('paused').textContent=manualPause?'Game paused':'Paused';$('paused').classList.toggle('show',manualPause);if(!manualPause)last=performance.now()};"
          s=s.replace(marker,inject+marker)
          p.write_text(s)
          m=re.search(r'<script>(.*)</script></body>',s,re.S)
          Path('/tmp/td.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/td.js'],check=True)
      - name: Commit
        run: |
          git config user.name "Esperanto Quest Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tdlearn.html
          git commit -m "Add arcade TD UI setup phase and pause controls"
          git push

name: Vortaventuro v5 English bilingual battles
on:
  push:
    paths:
      - '.github/workflows/aventuro-v5-english-undertale-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vortaventuro
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('aventuro.html')
          s=p.read_text()

          # Static interface to English.
          reps={
            '<span>Vivo</span>':'<span>Health</span>',
            '<span>Etaĝo</span>':'<span>Floor</span>',
            '<span>Forto</span>':'<span>Attack</span>',
            '<span>Defendo</span>':'<span>Defense</span>',
            '<span>Oro</span>':'<span>Gold</span>',
            '<span>Ŝlosiloj</span>':'<span>Keys</span>',
            '<span>Vortoj</span>':'<span>Words</span>',
            '<div class="kicker">EKIPAĴO</div>':'<div class="kicker">EQUIPMENT</div>',
            '<div class="kicker">DORSOSAKO</div>':'<div class="kicker">BACKPACK</div>',
            '<div class="kicker">VORTLIBRO</div>':'<div class="kicker">NOTEBOOK</div>',
            '<div class="kicker">OKAZINTAĴOJ</div>':'<div class="kicker">EVENT LOG</div>',
            'TORCH MAP · ? = UNKNOWN':'TORCH MAP · ? = UNKNOWN',
            "const names=['La Malseka Kripto','La Silenta Biblioteko','La Subtera Ĝardeno','La Forgesita Turo','La Halo de Ombroj','La Verda Labirinto','La Ruĝa Kelo','La Kavo de Sonoj'];":"const names=['The Damp Crypt','The Silent Library','The Underground Garden','The Forgotten Tower','The Hall of Shadows','The Green Labyrinth','The Red Cellar','The Cavern of Echoes'];",
          }
          for a,b in reps.items(): s=s.replace(a,b)

          # English species and dialogue. Esperanto is concentrated in questions/learning.
          s=re.sub(r"const species=\[.*?\];\nconst bossData=",'''const species=[
          ['Shadow Rat','I can smell your fear.'],['Damp Ghost','The water remembers every footstep.'],['Bone Guard','No one passes without an answer.'],['Night Beast','I can hear your heart.'],['Lost Wizard','Words are sharper than swords.'],['Cave Worm','The earth is hungry.'],['Red Spider','My web has been waiting for you.'],['Smoke Spirit','Can you actually see me?'],['Stone Golem','I stand. I guard. I crush.'],['Blind Crow','I see through sound.'],['Iron Beetle','Your sword sounds weak.'],['Ice Wolf','The night is my home.'],['Sea Hound','The water belongs to me.'],['Green Witch','Not every herb heals.'],['Weeping Mask','Why did you come here?'],['Ash Goblin','Fire is a good teacher.'],['Forest Shade','The trees know your name.'],['Crystal Insect','I can hear the light.'],['Copper Serpent','One mistake. One bite.'],['Silent Knight','Speak less. Think more.'],['Fog Hunter','You are already lost.'],['Cellar Mimic','Are you sure I am the monster?'],['Moon Hound','The moon commands me.'],['Wall Eye','I saw every step you took.'],['Rotten King','Every road ends with me.'],['Glass Child','Do not break what you do not understand.'],['Tired Miner','I have worked here far too long.'],['Slime Monk','Patience is a weapon.'],['Black Fawn','Do not follow the path.'],['Old Sailor','The bottom is closer than you think.'],['Golden Wasp','Wealth hurts.'],['Mirror Spirit','I repeat what you are.'],['Time Guard','Yesterday, today, tomorrow: choose carefully.'],['Final Archivist','Every word has a price.']];
          const bossData=''',s,flags=re.S)

          # Bilingual boss comprehension questions.
          s=re.sub(r"const bossData=\[.*?\];\nconst names=",'''const bossData=[
          ['The Gatekeeper','Mi staris antaŭ la pordo hieraŭ, sed morgaŭ mi iros tra ĝi.','I stood before the door yesterday, but tomorrow I will go through it.','Which word means “tomorrow”? / Kiu vorto signifas “tomorrow”?','morgaŭ',['hieraŭ','morgaŭ','antaŭ','pordo']],
          ['The Three-Voiced Queen','Se mi havus ŝlosilon, mi malfermus la pordon.','If I had a key, I would open the door.','Which form means “would open”? / Kiu formo signifas “would open”?','malfermus',['malfermis','malfermas','malfermus','malfermos']],
          ['The Night Judge','Li prenis la ringon, ĉar li bezonis lumon.','He took the ring because he needed light.','Why did he take the ring? / Kial li prenis la ringon?','ĉar li bezonis lumon',['ĉar li bezonis lumon','sed li timis','por vendi ĝin','ĉar li perdis glavon']]
          ];
          const names=''',s,flags=re.S)

          # English overworld messages and labels.
          old=r"function newRun\(\).*?function startBattle\(boss\)"
          new=r'''function newRun(){S={hp:14,maxHp:14,atk:2,def:0,gold:0,keys:0,floor:1,x:1,y:1,turn:0,streak:0,notebook:{},inventory:{pocio:1,ŝlosilo:0},equip:{weapon:'small sword',shield:'none',ring:'none'},floors:{}};getFloor(1);pending=false;closeModal();lesson('Darkness closes around you. Your torch is the only thing that feels certain.');render();log('The adventure begins.');saveRun()}
          function current(){return getFloor(S.floor)}function tile(x,y){return current().grid[y][x]}function torchDist(x,y){return Math.max(Math.abs(x-S.x),Math.abs(y-S.y))}
          function render(){let F=current(),m=$('map');m.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=document.createElement('div'),d=torchDist(x,y),t=F.grid[y][x],k=x+','+y;if(d<=2)F.seen[k]=1;c.className='cell ';if(x===S.x&&y===S.y){c.className+='player';c.textContent='YOU'}else if(d>2&&!F.seen[k]){c.className+='dark';c.textContent=''}else if(d>2){c.className+='seen';c.textContent='·'}else if(t==='.'){c.className+='floor';c.textContent='·'}else if(t==='#'){c.className+='wall';c.textContent='##'}else{c.className+='mystery';c.textContent='?'}m.appendChild(c)}$('hp').textContent=S.hp+'/'+S.maxHp;$('floorNo').textContent=S.floor;$('atk').textContent=S.atk;$('def').textContent=S.def;$('gold').textContent=S.gold;$('keys').textContent=S.keys;$('learned').textContent=Object.keys(S.notebook).length;$('placeName').textContent=current().village?'Village of the Green Lamp':names[(S.floor-1)%names.length];$('goal').textContent=current().village?'Talk to the villagers.':'Find the stairs. Stay alive.';$('equip').innerHTML='<span class="tag">Sword: '+esc(S.equip.weapon)+'</span><span class="tag">Shield: '+esc(S.equip.shield)+'</span><span class="tag">Ring: '+esc(S.equip.ring)+'</span>';$('inventory').innerHTML='<button class="tag" id="usePotion">Potion × '+(S.inventory.pocio||0)+'</button><span class="tag">Keys × '+S.keys+'</span>';$('usePotion').onclick=usePotion;let rows=Object.entries(S.notebook).sort((a,b)=>b[1].seen-a[1].seen);$('notebook').innerHTML=rows.length?rows.map(([w,n])=>'<div class="noteRow"><b>'+esc(w)+'</b><span>'+esc(n.meaning||'—')+' · '+n.seen+'×</span></div>').join(''):'No words discovered yet.';saveRun()}
          function directionHint(){let F=current(),targets=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if('MBEGKDTNS'.includes(F.grid[y][x]))targets.push([x,y,F.grid[y][x]]);if(!targets.length)return;targets.sort((a,b)=>md(S.x,S.y,a[0],a[1])-md(S.x,S.y,b[0],b[1]));let [x,y,t]=targets[0],d=md(S.x,S.y,x,y);if(d>6)return lesson('Something moves somewhere in the darkness.');let dir=Math.abs(x-S.x)>Math.abs(y-S.y)?(x>S.x?'to your right':'to your left'):(y>S.y?'below you':'above you');let clue=t==='M'||t==='B'?'You hear difficult breathing':t==='G'||t==='K'?'Something glitters':t==='E'?'You feel cold air':t==='N'||t==='S'?'You hear voices':'Something feels strange';lesson(clue+' '+dir+'. '+(d<=2?'It is very close.':d<=4?'It is close.':'It is not too far away.'))}
          function move(dx,dy){if(pending||S.hp<=0)return;let nx=S.x+dx,ny=S.y+dy;if(!inside(nx,ny))return;let t=tile(nx,ny);if(t==='#'){lesson('A wall blocks your path.');return}if(t==='D'){if(S.keys>0){S.keys--;current().grid[ny][nx]='.';lesson('You use a key and unlock the door.')}else{lesson('The door is locked. You need a key.');return}}S.x=nx;S.y=ny;S.turn++;t=tile(nx,ny);if(t==='M')startBattle(false);else if(t==='B')startBattle(true);else if(t==='G')treasure();else if(t==='K')takeKey();else if(t==='T')trap();else if(t==='E')stairs();else if(t==='N')npc();else if(t==='S')shop();else directionHint();if(Math.random()<.035&&S.turn>5)surprise();render()}
          function surprise(){if(Math.random()<.7){let z=2+r(5);S.gold+=z;lesson('You suddenly find '+z+' gold coins.')}else if(Math.random()<.6){S.inventory.pocio=(S.inventory.pocio||0)+1;lesson('You suddenly find a potion.')}else startBattle(false)}
          function takeKey(){current().grid[S.y][S.x]='.';S.keys++;lesson('You found a key.');log('+1 key')}
          function treasure(){current().grid[S.y][S.x]='.';let roll=r(5);if(roll===0){S.equip.weapon='iron sword';S.atk++;lesson('You found an iron sword.')}else if(roll===1){S.equip.shield='wooden shield';S.def++;lesson('You found a shield.')}else if(roll===2){S.equip.ring='ring of light';S.maxHp+=2;S.hp+=2;lesson('You found a ring of light.')}else{let z=5+r(8)+S.floor;S.gold+=z;lesson('You found '+z+' gold coins.')}}
          function trap(){current().grid[S.y][S.x]='.';let d=Math.max(1,2+Math.floor(S.floor/3)-S.def);S.hp-=d;lesson('A trap springs! You lose '+d+' health.');if(S.hp<=0)die()}
          function stairs(){pending=true;choice('A staircase leads deeper. Descend?',[['Go down.',()=>{S.floor++;S.x=1;S.y=1;getFloor(S.floor);pending=false;lesson('You descend to a new floor.');render()}],['Stay here.',()=>{pending=false;directionHint()}]])}
          function npc(){let n=pick(npcLines);current().grid[S.y][S.x]='.';pending=true;choice('A villager stops you. '+(n[1]||'They study you carefully.'),[['Thank them.',()=>{pending=false;lesson('The villager smiles and says goodbye.')}],['Ask about danger.',()=>{pending=false;lesson('“The danger grows on every floor. Learn the verbs.”')}]] )}
          function shop(){pending=true;choice('A merchant opens a battered case. What do you want to buy?',[['Potion — 8 gold',()=>buy('pocio',8)],['Iron shield — 22 gold',()=>buy('shield',22)],['Health ring — 28 gold',()=>buy('ring',28)],['Nothing.',()=>{pending=false;lesson('The merchant closes the case.')} ]])}
          function buy(type,cost){if(S.gold<cost){lesson('You do not have enough gold.');return}S.gold-=cost;if(type==='pocio')S.inventory.pocio=(S.inventory.pocio||0)+1;if(type==='shield'){S.equip.shield='iron shield';S.def=Math.max(S.def,2)}if(type==='ring'){S.equip.ring='health ring';S.maxHp+=3;S.hp+=3}pending=false;lesson('Purchase complete.');render()}
          function usePotion(){if(!(S.inventory.pocio>0))return;S.inventory.pocio--;S.hp=Math.min(S.maxHp,S.hp+6);lesson('You drink a potion and recover health.');render()}
          function startBattle(boss)'''
          s,n=re.subn(old,new,s,flags=re.S)
          if n!=1: raise SystemExit('overworld patch failed '+str(n))

          # Replace battle system with a more menu -> action -> dodge loop, inspired by classic bullet-dodge RPGs but original in presentation.
          old=r"function startBattle\(boss\).*?function winBattle\(\)"
          new=r'''function startBattle(boss){pending=true;let sp=boss?['BOSS','The darkness itself seems to speak.']:pick(species);battle={boss,name:boss?'Floor '+S.floor+' Guardian':sp[0],dialogue:boss?'Strength alone will not get you through this.':sp[1],hp:(boss?18:7)+S.floor*2,max:(boss?18:7)+S.floor*2,atk:2+Math.floor(S.floor/2),mercy:0};renderBattle()}
          function renderBattle(){let b=battle;$('modalBox').innerHTML='<div class="battleTop"><div><h2>'+esc(b.name)+'</h2><div>'+esc(b.dialogue)+'</div></div><div>HP '+S.hp+'/'+S.maxHp+'<div class="hpbar"><i style="width:'+100*S.hp/S.maxHp+'%"></i></div><br>Enemy '+Math.max(0,b.hp)+'/'+b.max+'<div class="hpbar enemybar"><i style="width:'+100*Math.max(0,b.hp)/b.max+'%"></i></div></div></div><div id="battleText" class="battleText">Choose an action.</div><div class="battleActions"><button data-a="attack">FIGHT</button><button data-a="spell">SPELL</button><button data-a="talk">TALK</button><button data-a="defend">GUARD</button><button data-a="run">FLEE</button></div><div id="battleExtra"></div>';$('modal').classList.add('show');document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>battleAction(x.dataset.a))}
          function battleAction(a){if(a==='attack')return timingAttack();if(a==='spell')return grammarSpell();if(a==='talk'){battle.mercy++;$('battleText').textContent=battle.dialogue+(battle.mercy>=2?' It seems less eager to fight.':'');if(battle.mercy>=3&&!battle.boss){setTimeout(()=>endBattle(false),600);return}return setTimeout(()=>enemyTurn(false),650)}if(a==='defend')return enemyTurn(true);if(a==='run'){if(battle.boss){$('battleText').textContent='There is nowhere to run from this guardian.';return}if(Math.random()<.55+battle.mercy*.12)return endBattle(false);return enemyTurn(false)}}
          function timingAttack(){let ex=$('battleExtra'),pos=0,dir=1,stopped=0;ex.innerHTML='<div class="battleText">Stop the marker near the center, then answer the language question.</div><div style="position:relative;height:34px;border:2px solid #cdd6d0;background:#050706;margin:8px 0"><div style="position:absolute;left:46%;width:8%;top:0;bottom:0;background:#32523b"></div><div id="atkMarker" style="position:absolute;top:2px;bottom:2px;width:5px;background:#fff;left:0"></div></div><button id="strikeNow" style="width:100%">STRIKE</button>';let marker=$('atkMarker'),last=performance.now();function tick(t){if(stopped)return;let dt=(t-last)/1000;last=t;pos+=dir*95*dt;if(pos>=99){pos=99;dir=-1}if(pos<=0){pos=0;dir=1}marker.style.left=pos+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick);function stop(){if(stopped)return;stopped=1;let timing=Math.max(.35,1-Math.abs(pos-50)/55);vocabAttack(timing)}$('strikeNow').onclick=stop;let k=e=>{if((e.key===' '||e.key==='Enter')&&!stopped){e.preventDefault();window.removeEventListener('keydown',k);stop()}};window.addEventListener('keydown',k);setTimeout(()=>{if(!stopped){window.removeEventListener('keydown',k);stop()}},2200)}
          function vocabAttack(timing=1){let q=pick(deck),opts=[q.eo];while(opts.length<4){let z=pick(deck).eo;if(!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);showQuiz('English: How do you say “'+q.en+'” in Esperanto?','Esperanto: Kiel oni diras “'+q.en+'” en Esperanto?',opts,q.eo,ok=>{let dmg=Math.max(1,Math.round((ok?S.atk+3:S.atk*.5)*timing));hitEnemy(dmg);if(battle)enemyTurn(false)})}
          function grammarSpell(){let v=pick(verbs),forms=[['present','present / prezenco'],['past','past / pasinteco'],['future','future / estonteco'],['conditional','conditional / kondicionalo'],['imperative','imperative / imperativo']],f=pick(forms),correct=v[f[0]],opts=[correct];while(opts.length<4){let z=pick(verbs)[f[0]];if(z&&!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);showQuiz('English: Choose the '+f[1].split(' / ')[0]+' form of “'+v.en+'” ('+v.inf+').','Esperanto: Elektu la '+f[1].split(' / ')[1]+'-formon de “'+v.inf+'”.',opts,correct,ok=>{if(ok){S.streak++;hitEnemy(S.atk+5+Math.min(4,S.streak))}else{S.streak=0;$('battleText').textContent='The spell breaks apart before it reaches the enemy.'}if(battle)enemyTurn(false)})}
          function showQuiz(enPrompt,eoPrompt,opts,correct,cb){let ex=$('battleExtra');ex.innerHTML='<div class="battleText"><div>'+esc(enPrompt)+'</div><div style="margin-top:5px;color:#b8d9c0">'+esc(eoPrompt)+'</div></div><div class="quizChoices">'+opts.map(o=>'<button data-q="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';ex.querySelectorAll('[data-q]').forEach(btn=>btn.onclick=()=>{let ok=btn.dataset.q===correct;btn.classList.add(ok?'good':'bad');learn(correct);setTimeout(()=>{ex.innerHTML='';cb(ok)},420)})}
          function hitEnemy(d){battle.hp-=d;$('battleText').textContent='You deal '+d+' damage.';if(battle.hp<=0)winBattle()}
          function enemyTurn(block){if(!battle)return;startArena(block)}
          function startArena(block){let ex=$('battleExtra'),pattern=r(3);ex.innerHTML='<div class="battleText">Enemy turn. Move YOU inside the box and avoid the red words.</div><div class="arena" id="arena"><div class="soul" id="soul">YOU</div></div><div class="arenaControls"><button class="u" data-m="0,-1">↑</button><button class="l" data-m="-1,0">←</button><button class="r" data-m="1,0">→</button><button class="d" data-m="0,1">↓</button></div><div class="kicker" style="margin-top:5px">Red words hurt only when they actually touch you. Green words are optional bonuses.</div>';let arena=$('arena'),soul=$('soul'),x=50,y=75,haz=[],good=pick(['ŝildo','sekura','defendu','rapide','maldekstre']),lastHit=0,start=performance.now(),last=start,got=0;soul.style.left=x+'%';soul.style.top=y+'%';function addHaz(text,xp,yp,vx,vy){let h=document.createElement('div');h.className='hazard';h.textContent=text;h.style.left=xp+'%';h.style.top=yp+'%';arena.appendChild(h);haz.push({el:h,x:xp,y:yp,vx,vy,dead:0})}let count=7+Math.min(8,S.floor);for(let i=0;i<count;i++){if(pattern===0)addHaz(pick(['danĝero','fajro','mordo','kaptilo','ombro','frapo']),8+r(84),-10-r(90),0,22+r(18));else if(pattern===1){let left=i%2===0;addHaz(pick(['rapide','ataku','gardu','fajro']),left?-15:115,10+r(80),left?26+r(14):-(26+r(14)),0)}else{let ang=(i/count)*Math.PI*2;addHaz(pick(['ombro','mordo','frapo']),50+42*Math.cos(ang),50+42*Math.sin(ang),-Math.sin(ang)*(12+r(6)),Math.cos(ang)*(12+r(6)))}}let bon=document.createElement('div');bon.className='bonus';bon.textContent=good;bon.style.left=(15+r(70))+'%';bon.style.top='-15%';arena.appendChild(bon);let bx=parseFloat(bon.style.left),by=-15;function moveSoul(dx,dy){x=Math.max(4,Math.min(96,x+dx*7));y=Math.max(6,Math.min(94,y+dy*7));soul.style.left=x+'%';soul.style.top=y+'%'}ex.querySelectorAll('[data-m]').forEach(b=>b.onpointerdown=()=>{let d=b.dataset.m.split(',').map(Number);moveSoul(...d)});let drag=0;arena.onpointerdown=e=>{drag=1;arena.setPointerCapture?.(e.pointerId);pointer(e)};arena.onpointermove=e=>{if(drag)pointer(e)};arena.onpointerup=()=>drag=0;function pointer(e){let q=arena.getBoundingClientRect();x=Math.max(4,Math.min(96,(e.clientX-q.left)/q.width*100));y=Math.max(6,Math.min(94,(e.clientY-q.top)/q.height*100));soul.style.left=x+'%';soul.style.top=y+'%'}let keyFn=e=>{let d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[e.key.toLowerCase()];if(d){e.preventDefault();moveSoul(...d)}};window.addEventListener('keydown',keyFn);function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;for(let h of haz){if(h.dead)continue;h.x+=h.vx*dt;h.y+=h.vy*dt;if(pattern===2){let dx=h.x-50,dy=h.y-50;if(Math.hypot(dx,dy)>47){h.vx*=-1;h.vy*=-1}}h.el.style.left=h.x+'%';h.el.style.top=h.y+'%';let sr=soul.getBoundingClientRect(),hr=h.el.getBoundingClientRect(),touch=sr.left<hr.right&&sr.right>hr.left&&sr.top<hr.bottom&&sr.bottom>hr.top;if(touch&&t-lastHit>500){lastHit=t;let dmg=Math.max(1,battle.atk-S.def-(block?1:0));S.hp-=dmg;h.dead=1;h.el.remove();soul.classList.add('bad');setTimeout(()=>soul.classList.remove('bad'),170);$('battleText').textContent='You were hit for '+dmg+' damage.';if(S.hp<=0){window.removeEventListener('keydown',keyFn);return die()}}}by+=24*dt;bon.style.top=by+'%';let br=bon.isConnected?bon.getBoundingClientRect():null,sr=soul.getBoundingClientRect();if(!got&&br&&sr.left<br.right&&sr.right>br.left&&sr.top<br.bottom&&sr.bottom>br.top){got=1;bon.remove();S.hp=Math.min(S.maxHp,S.hp+1);learn(good)}if(t-start<3400)arenaLoop=requestAnimationFrame(loop);else{window.removeEventListener('keydown',keyFn);ex.innerHTML='';renderBattle()}}arenaLoop=requestAnimationFrame(loop)}
          function winBattle()'''
          s,n=re.subn(old,new,s,flags=re.S)
          if n!=1: raise SystemExit('battle patch failed '+str(n))

          # English endings, boss bilingual display, English guide.
          s=re.sub(r"function bossRiddle\(\).*?function closeModal\(\)\{\$\('modal'\)\.classList\.remove\('show'\)\}",r'''function bossRiddle(){let d=bossData[(Math.floor(S.floor/5)-1)%bossData.length];$('modalBox').innerHTML='<h2>'+esc(d[0])+'</h2><div class="battleText"><b>Esperanto clue:</b><br>'+esc(d[1])+'<br><br><b>English:</b><br>'+esc(d[2])+'</div><div>'+esc(d[3])+'</div><div class="quizChoices">'+d[5].map(o=>'<button data-b="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';document.querySelectorAll('[data-b]').forEach(btn=>btn.onclick=()=>{if(btn.dataset.b===d[4]){learn(d[4]);$('modal').classList.remove('show');pending=false;S.maxHp+=2;S.hp=Math.min(S.maxHp,S.hp+4);lesson('The guardian yields. You understood the clue.');render()}else{S.hp-=2;btn.classList.add('bad');if(S.hp<=0)die()}})}
          function endBattle(win){battle=null;$('modal').classList.remove('show');pending=false;lesson(win?'You won the battle.':'You escaped the battle.');render()}
          function die(){battle=null;pending=true;$('modalBox').innerHTML='<h2>Your run is over.</h2><p>You reached floor '+S.floor+' and discovered '+Object.keys(S.notebook).length+' Esperanto words.</p><button id="again">New run</button>';$('modal').classList.add('show');$('again').onclick=newRun}
          function closeModal(){$('modal').classList.remove('show')}''',s,flags=re.S)

          # Replace guide with concise English only.
          s=re.sub(r"function help\(\)\{.*?\}\ndocument\.querySelectorAll",r'''function help(){$('modalBox').innerHTML='<h2>A note pinned to your coat</h2><p>If you can read this, you are still alive.</p><p>Your torch reveals only a small area. Unknown things remain <b>?</b> until you reach them. Search for keys, doors, equipment, villages, stairs, traps, treasure, and creatures.</p><p>During battle, choose an action. FIGHT uses a timing strike followed by a bilingual Esperanto question. SPELL tests verb conjugation in both English and Esperanto. TALK can calm some enemies. GUARD reduces damage. FLEE may fail.</p><p>When the enemy attacks, move <b>YOU</b> inside the battle box. Red words only damage you if they physically touch you. You can use the arrows, WASD, the touch controls, or drag directly inside the box.</p><p>The Notebook automatically records Esperanto words you encounter in questions.</p><button id="closeHelp">Fold the note</button>';$('modal').classList.add('show');$('closeHelp').onclick=closeModal}
          document.querySelectorAll''',s,flags=re.S)

          p.write_text(s)
          PY
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('aventuro.html').read_text()
          js=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/check.js').write_text(js)
          PY
          node --check /tmp/check.js

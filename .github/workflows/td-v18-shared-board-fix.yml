name: TD v18 shared board fix
"on":
  push:
    paths:
      - '.github/workflows/td-v18-shared-board-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/td_v18_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tdlearn.html
          git diff --cached --quiet || git commit -m "Make co-op use one shared editable board"
          git push
